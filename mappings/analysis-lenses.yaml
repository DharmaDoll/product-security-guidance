  - artifact_id: PSB-AI-001
    artifact_path: ../controls/records/ai-development-security/psb-ai-001-repository-agent-guidance/README.md
    source_refs: [REF-DEVELOPMENT-GUIDANCE-001]
    product_security_layers:
      - dimension: governance
        relationship: direct
        rationale: Defines ownership and review of repository guidance for development agents.
      - dimension: education-and-culture
        relationship: adjacent
        rationale: Guidance can influence developer-agent behavior but does not prove training or safe decisions.
    supply_chain_attack_stages:
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: direct
        rationale: Guidance changes enter through source review and protected branch acceptance.
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: The actual guidance read by a coding agent and its measured development effect are distinct checks.
      - dimension: stage-01-developer-endpoint-and-local-trust
        relationship: handoff
        rationale: Runtime operation remains externally bounded regardless of instruction content.
    attack_paths: [tampered-repository-guidance-to-developer-agent]
    limitations: [No live agent reading effectiveness or protected GitHub branch verification. Product AI TEVV is out of scope.]
  - artifact_id: ENG-AI-005
    artifact_path: ../engineering/ai-development-security/repository-agent-guidance-review/README.md
    source_refs: [REF-DEVELOPMENT-GUIDANCE-001]
    product_security_layers:
      - dimension: governance
        relationship: direct
        rationale: Designs independent review and receipt of guidance changes.
    supply_chain_attack_stages:
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: direct
        rationale: Binds changed guidance to an owned acceptance path.
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: Compares actual coding-agent behavior with and without the guidance under matched conditions.
    attack_paths: [tampered-repository-guidance-to-developer-agent]
    limitations: [The GitHub configuration example and comparison method are not deployed evidence.]
  - artifact_id: PSB-AI-003
    artifact_path: ../controls/records/ai-development-security/psb-ai-003-development-content-injection-boundary/README.md
    source_refs: [REF-DEVELOPMENT-INPUT-TRUST-001]
    product_security_layers:
      - dimension: application
        relationship: adjacent
        rationale: Coding-agent output can change application source, but generated-code security remains a separate review.
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Defines the boundary between development content, task authority and developer-agent operations.
    supply_chain_attack_stages:
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: handoff
        rationale: Repository documents and PR text enter the coding-agent context with their original trust level.
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: Indirect instructions in content must not become task or action authority.
      - dimension: stage-01-developer-endpoint-and-local-trust
        relationship: handoff
        rationale: Runtime isolation and credential boundaries must block unintended access and disclosure.
    attack_paths: [untrusted-development-content-to-agent-authority]
    limitations: [Guidance and diagnostic checks only; no live model, tool or task-result verification.]
  - artifact_id: ENG-AI-004
    artifact_path: ../engineering/ai-development-security/untrusted-development-content-boundary/README.md
    source_refs: [REF-DEVELOPMENT-INPUT-TRUST-001]
    product_security_layers:
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Designs source labeling, task continuity and independent action checks for development agents.
    supply_chain_attack_stages:
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: The design separates untrusted content from instructions and execution decisions.
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: handoff
        rationale: Reviewed and untrusted branches need distinguishable content origins.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Denial and observation failure need safe evidence and an owner for investigation.
    attack_paths: [untrusted-development-content-to-agent-authority]
    limitations: [No provider configuration or executable gate; product AI security is outside this project's scope.]
  - artifact_id: PSB-AI-004
    artifact_path: ../controls/records/ai-development-security/psb-ai-004-development-agent-runtime-boundary/README.md
    source_refs: [REF-DEVELOPMENT-RUNTIME-RECONCILIATION-001]
    product_security_layers:
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Defines externally enforced developer-agent authority and runtime reconciliation.
    supply_chain_attack_stages:
      - dimension: stage-01-developer-endpoint-and-local-trust
        relationship: direct
        rationale: Defines file credential and network reachability limits.
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: Defines extension and invocation reconciliation with current approval.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Audit collection and delivery must reach an owned response process.
    attack_paths: [poisoned-agent-extension-to-developer-authority]
    limitations: [Guidance only; no live isolation authorization inventory or telemetry verification.]
  - artifact_id: ENG-AI-003
    artifact_path: ../engineering/ai-development-security/development-runtime-isolation/README.md
    source_refs: [REF-DEVELOPMENT-RUNTIME-ISOLATION-001, REF-DEVELOPMENT-RUNTIME-RECONCILIATION-001]
    product_security_layers:
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Defines process reachability and externally managed isolation independently of action approval.
    supply_chain_attack_stages:
      - dimension: stage-01-developer-endpoint-and-local-trust
        relationship: direct
        rationale: Bounds developer-agent access to files credentials and local or external services.
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: Reviewed extensions remain subject to runtime boundaries and cannot widen managed policy.
      - dimension: stage-07-runner-and-build-execution
        relationship: handoff
        rationale: Agent-launched builds still require build containment and runner lifecycle controls.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Local decisions require authenticated collection, coverage checks and owned alert delivery; live detection and response remain unverified.
    attack_paths: [poisoned-agent-extension-to-developer-authority]
    limitations:
      - Design-only extraction of isolation network and audit outcomes; no product configuration or live isolation collection or delivery test.
      - Does not establish endpoint-wide protection or live adoption of the AI-004 guidance.
  - artifact_id: ENG-AI-002
    artifact_path: ../engineering/ai-development-security/development-action-authorization/README.md
    source_refs: [REF-DEVELOPMENT-ACTION-AUTHORIZATION-001]
    product_security_layers:
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Defines independent authorization for exact developer-agent actions; no implementation claim.
    supply_chain_attack_stages:
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: Untrusted instructions and extension proposals must not define execution authority.
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: handoff
        rationale: Exact source publication requires destination authorization and non-bypassable execution.
      - dimension: stage-06-cicd-identity-and-control-plane
        relationship: handoff
        rationale: CI and development infrastructure retain their credential and policy enforcement responsibilities.
    attack_paths: [poisoned-agent-extension-to-developer-authority]
    limitations:
      - Design guidance linked to AI-004; framework relationships remain migration-review-required.
      - Endpoint isolation, product settings, approval service, replay store and backend outcome reconciliation remain unverified.
  - artifact_id: PSB-AI-002
    artifact_path: ../controls/records/ai-development-security/psb-ai-002-agent-extension-dependency-governance/README.md
    product_security_layers:
      - dimension: external-and-supply-chain
        relationship: direct
        rationale: External code and instructions are admitted only with reviewed immutable identity and current approval.
      - dimension: governance
        relationship: direct
        rationale: Ownership, independent review, license, expiry and revocation define continued adoption decisions.
      - dimension: platform-and-infrastructure
        relationship: handoff
        rationale: Runtime must correlate loaded extensions with approved identity and enforce capabilities independently.
    supply_chain_attack_stages:
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: direct
        rationale: Controls admission of Skills, MCP servers, plugins and external prompts into development agents.
      - dimension: stage-01-developer-endpoint-and-local-trust
        relationship: handoff
        rationale: Endpoint loading, isolation and effective authority require runtime evidence beyond an approval manifest.
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: handoff
        rationale: Source access credentials and write authorization remain separate controls after extension admission.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Revoked dependency identity must reach runtime denial and incident responders; running-session termination is not established here.
    attack_paths: [poisoned-agent-extension-to-developer-authority]
    limitations:
      - Synthetic approval records do not prove semantic review quality, behavioral safety or publisher trust.
      - Source commits do not prove remote server deployment identity.
      - Live loading, capability enforcement, benchmark infrastructure and revocation execution remain unmigrated or unverified.
  - artifact_id: PSB-DETECT-001
    artifact_path: ../controls/records/detection-verification/psb-detect-001-scanner-evidence-trust-boundary/README.md
    product_security_layers:
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Scanner tool data policy execution and gate evidence form the primary assurance boundary.
      - dimension: operations
        relationship: handoff
        rationale: Error and freshness states must be monitored; live operation is unverified.
      - dimension: external-and-supply-chain
        relationship: direct
        rationale: Scanner executables databases and orchestrators are reviewed third-party dependencies.
    supply_chain_attack_stages:
      - dimension: stage-05-ci-workflow-pr-action-and-cache
        relationship: adjacent
        rationale: A scanner may run in CI but workflow authority and cache trust remain separate.
      - dimension: stage-07-runner-and-build-execution
        relationship: adjacent
        rationale: Scanner execution consumes runner authority; containment remains separate.
      - dimension: stage-09-artifact-release-signing-and-sbom
        relationship: direct
        rationale: Exact artifacts and SBOMs receive bounded deterministic scanning before release decisions.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: direct
        rationale: Clean finding and error states are distinct detection outputs handed to triage.
    attack_paths: [compromised-scanner-to-ci, scanner-error-to-unsafe-release]
    limitations:
      - No live scanner distribution database coverage gate or monitoring evidence.
      - Does not provide SAST DAST runtime detection or unknown-vulnerability assurance.
  - artifact_id: PSB-DETECT-003
    artifact_path: ../controls/records/detection-verification/psb-detect-003-external-attack-surface-reconciliation/README.md
    source_refs: [REF-EXTERNAL-SURFACE-001]
    product_security_layers:
      - dimension: operations
        relationship: direct
        rationale: External observations are reconciled with an owned inventory and handed to operators for investigation.
      - dimension: platform-and-infrastructure
        relationship: adjacent
        rationale: The control needs authoritative domain cloud or service inventory but does not create it.
    supply_chain_attack_stages:
      - dimension: stage-11-production-runtime-and-external-exposure
        relationship: direct
        rationale: Compares observed public services with intended exposure and owner records.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Unknown unexpected or reappeared exposure goes to an accountable investigator; observation failure is separate.
    attack_paths: [unknown-public-service-to-untriaged-exposure, collection-failure-to-false-clean]
    limitations:
      - No live observation inventory completeness attribution or authorized active validation has been verified.
      - Does not detect an attacker's reconnaissance or prove vulnerability absence.
  - artifact_id: ENG-DETECT-002
    artifact_path: ../engineering/detection-verification/external-observation-and-inventory-reconciliation/README.md
    source_refs: [REF-EXTERNAL-SURFACE-001]
    product_security_layers:
      - dimension: operations
        relationship: direct
        rationale: Designs source health inventory difference attribution and response states.
    supply_chain_attack_stages:
      - dimension: stage-11-production-runtime-and-external-exposure
        relationship: direct
        rationale: Designs the join between externally visible candidates and the expected inventory.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Sends unresolved exposure and collection failure to distinct operational paths.
    limitations: [No provider collector test target or live case workflow has been selected.]
  - artifact_id: PSB-GOV-002
    artifact_path: ../controls/records/governance-operations/psb-gov-002-security-exception-lifecycle/README.md
    product_security_layers:
      - dimension: governance
        relationship: direct
        rationale: Exact independently approved expiring risk decisions remain separate from underlying control results.
      - dimension: operations
        relationship: adjacent
        rationale: Consumers evaluate current state at enforcement time; live operation remains unverified.
    supply_chain_attack_stages:
