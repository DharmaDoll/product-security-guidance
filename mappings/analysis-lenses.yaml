schema_version: "0.1-pilot"
artifact_kind: analysis-lens-mapping
status: pilot
scope_policy: ../docs/SECURITY_SCOPE.md
scope_exclusions:
  application_ai_security:
    disposition: out-of-scope
    reference: https://github.com/DharmaDoll/ai-security-foundry
    note: User-directed project ownership; not a claim of implementation or coverage in the referenced project.
    legacy_control_ids: [PSB-AI-010, PSB-AI-011, PSB-DEPS-005, PSB-DETECT-002]
    topics: [product AI agents, RAG, models and datasets, AI application gateways, product AI TEVV]
scope_review_required:
  legacy_control_ids: [PSB-AI-005, PSB-AI-006, PSB-AI-007, PSB-AI-008, PSB-AI-009]
  decision: Retain only outcomes protecting developer endpoints, coding agents, repositories or CI; exclude product AI functionality.
description: >-
  Cross-cutting navigation for portfolio gaps and supply-chain attack-stage
  handoffs. Relationships are not control coverage, adoption, or compliance.
sources:
  - source_ref: REF-PORTFOLIO-001
    role: portfolio-completeness-and-navigation
  - source_ref: LOCAL-SUPPLY-CHAIN-ATTACK-STAGES
    role: attack-path-and-control-handoff-analysis
relationship_types:
  direct: the artifact defines an outcome at this layer or stage
  adjacent: the artifact supports a boundary but does not own the primary outcome
  handoff: the artifact output must be preserved by a later stage
  gap: the migration pilot has no direct artifact for this layer or stage
lenses:
  - id: product-security-layers
    source_ref: REF-PORTFOLIO-001
    dimensions:
      - application
      - platform-and-infrastructure
      - operations
      - psirt-and-vulnerability-management
      - external-and-supply-chain
      - governance
      - education-and-culture
  - id: supply-chain-attack-stages
    source_ref: LOCAL-SUPPLY-CHAIN-ATTACK-STAGES
    dimensions:
      - stage-01-developer-endpoint-and-local-trust
      - stage-02-source-repository-and-vcs-control-plane
      - stage-03-ai-assisted-development-supply-chain
      - stage-04-dependency-selection-resolution-and-acquisition
      - stage-05-ci-workflow-pr-action-and-cache
      - stage-06-cicd-identity-and-control-plane
      - stage-07-runner-and-build-execution
      - stage-08-build-platform-and-provenance-generation
      - stage-09-artifact-release-signing-and-sbom
      - stage-10-registry-iac-and-deployment-admission
      - stage-11-production-runtime-and-external-exposure
      - stage-12-detection-incident-response-and-recovery
pilot_reconciliation:
  product_security_layers:
    - dimension: application
      relationship: direct
      rationale: Object access design and a bounded SQLite implementation exist; HTTP authentication, endpoint coverage and application controls remain unverified or unmigrated.
    - dimension: platform-and-infrastructure
      relationship: direct
      rationale: Guidance addresses source authority, dependency intake, PR cache runner boundaries, workload federation, build containment and scanner evidence; live enforcement remains unverified.
    - dimension: operations
      relationship: direct
      rationale: Runtime detection, triage and credential-containment guidance define observation health, delivery and bounded recovery decisions; live monitoring and response remain unverified.
    - dimension: psirt-and-vulnerability-management
      relationship: direct
      rationale: Supply-chain impact assessment, credential containment and deployed-artifact recovery are defined; intake, disclosure and live capability remain separate.
    - dimension: external-and-supply-chain
      relationship: direct
      rationale: Guidance addresses dependency review identity and execution, extension admission, platform provenance generation, consumer verification and deployment artifact admission; artifact signing and publication remain separate.
    - dimension: governance
      relationship: direct
      rationale: Exception lifecycle and extension adoption ownership are defined; organization-wide governance and live adoption remain unverified.
    - dimension: education-and-culture
      relationship: adjacent
      rationale: Learning notes provide readable scenario-based navigation to controls and patterns; learner comprehension and attendance are outside repository records.
  supply_chain_attack_stages:
    - dimension: stage-01-developer-endpoint-and-local-trust
      relationship: direct
      rationale: Endpoint management design separates enrollment, current observations and access decisions; source credentials and developer-agent isolation remain distinct boundaries. Live enforcement is unverified.
    - dimension: stage-02-source-repository-and-vcs-control-plane
      relationship: direct
      rationale: Secret publication defines scoped source acceptance; code review and broader control-plane change assurance remain separate.
    - dimension: stage-03-ai-assisted-development-supply-chain
      relationship: direct
      rationale: AI extension admission is defined through reviewed identity, capabilities and revocation; live loading and runtime tool authorization remain unverified.
    - dimension: stage-04-dependency-selection-resolution-and-acquisition
      relationship: direct
      rationale: Dependency cooldown install execution artifact identity and change review define separate intake outcomes.
    - dimension: stage-05-ci-workflow-pr-action-and-cache
      relationship: direct
      rationale: Untrusted PR isolation directly separates contributor-controlled execution and derived state from privileged consumers.
    - dimension: stage-06-cicd-identity-and-control-plane
      relationship: direct
      rationale: Source credential lifecycle and workload federation define identity and exchanged-authority boundaries without covering all control-plane changes.
    - dimension: stage-07-runner-and-build-execution
      relationship: direct
      rationale: Runner lifecycle and build containment records define distinct outcomes; live enforcement and adoption remain unverified.
    - dimension: stage-08-build-platform-and-provenance-generation
      relationship: direct
      rationale: Platform provenance generation defines control-plane generation, artifact binding, field sources and authentication; approved-builder selection and a live implementation remain separate.
    - dimension: stage-09-artifact-release-signing-and-sbom
      relationship: direct
      rationale: Consumer signature and provenance acceptance is defined; signing generation, SBOM binding and live crypto verification remain separate.
    - dimension: stage-10-registry-iac-and-deployment-admission
      relationship: direct
      rationale: Exact artifact admission and container registry publication are defined as direct boundaries; IaC enforcement, workload confinement, rollout and live adoption remain separate.
    - dimension: stage-11-production-runtime-and-external-exposure
      relationship: direct
      rationale: Runtime detection and public source exposure triage guidance exist; live sensors, collectors and broader external surface reconciliation are not verified.
    - dimension: stage-12-detection-incident-response-and-recovery
      relationship: direct
      rationale: Evidence-linked impact assessment, credential containment and deployed-artifact recovery decisions are defined; live mutation and complete recovery remain unverified.
