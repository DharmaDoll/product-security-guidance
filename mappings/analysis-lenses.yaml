  - artifact_id: PSB-SOURCE-001
    artifact_path: ../controls/records/source-protection/psb-source-001-developer-endpoint-trust/README.md
    source_refs: [REF-DEVELOPER-ENDPOINT-BASELINE-001]
    product_security_layers:
      - dimension: platform-and-infrastructure
        relationship: direct
        rationale: Defines managed endpoint baseline, current observations and resource access decisions.
      - dimension: operations
        relationship: handoff
        rationale: Endpoint health, notification, containment and recovery require separately owned operations.
      - dimension: governance
        relationship: adjacent
        rationale: Baseline ownership and bounded remediation or exceptions require organization decisions.
    supply_chain_attack_stages:
      - dimension: stage-01-developer-endpoint-and-local-trust
        relationship: direct
        rationale: Endpoint state and authority are managed independently of a successful enrollment record.
      - dimension: stage-02-source-repository-and-vcs-control-plane
        relationship: handoff
        rationale: Compromised or lost endpoint identity is handed to credential owners for session and credential revocation.
      - dimension: stage-03-ai-assisted-development-supply-chain
        relationship: adjacent
        rationale: Managed endpoint status does not replace agent extension admission or runtime isolation.
      - dimension: stage-07-runner-and-build-execution
        relationship: adjacent
        rationale: High-risk execution requires a separate runtime boundary even on managed endpoints.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: handoff
        rationale: Observation loss, containment and affected source changes require accountable investigation.
    attack_paths:
      - source-credential-compromise
    limitations:
      - Scoped control and design migration; no endpoint assessment, product adapter or live adoption claim.
