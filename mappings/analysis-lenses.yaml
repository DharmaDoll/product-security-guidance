        rationale: Receives artifact-bound SBOM and build evidence; does not generate signatures or provenance.
      - dimension: stage-11-production-runtime-and-external-exposure
        relationship: handoff
        rationale: Receives exact observed deployment identity; does not implement runtime sensing.
      - dimension: stage-12-detection-incident-response-and-recovery
        relationship: direct
        rationale: Defines bounded impact query and approved planning, not executed response or recovery.
    limitations: [No live inventory completeness, response execution, recovery or PSIRT maturity claim.]
  - artifact_id: PSB-CONTAINER-005
    artifact_path: ../controls/records/container-cloud-iac-security/psb-container-005-workload-privilege-confinement/README.md
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
    product_security_layers:
