        relationship: direct
        rationale: Defines the final process kernel host filesystem and control-plane authority boundaries for a workload.
      - dimension: operations
        relationship: handoff
        rationale: Admission decisions and intended profiles must be compared with effective runtime state and observation health.
    supply_chain_attack_stages:
      - dimension: stage-10-registry-iac-and-deployment-admission
