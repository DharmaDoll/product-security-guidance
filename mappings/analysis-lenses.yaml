schema_version: "0.1-pilot"
artifact_kind: analysis-lens-mapping
status: pilot
scope_policy: ../docs/SECURITY_SCOPE.md
scope_exclusions:
  application_ai_security:
    disposition: out-of-scope
    reference: https://github.com/DharmaDoll/ai-security-foundry
    note: User-directed project ownership; not a claim of implementation or coverage in the referenced project.
    legacy_control_ids: [PSB-AI-010, PSB-AI-011, PSB-DEPS-005, PSB-DETECT-002]
    topics: [product AI agents, RAG, models and datasets, AI application gateways, product AI TEVV]
scope_review_required:
  legacy_control_ids: [PSB-AI-005, PSB-AI-006, PSB-AI-007, PSB-AI-008, PSB-AI-009]
  decision: Retain only outcomes protecting developer endpoints, coding agents, repositories or CI; exclude product AI functionality.
description: >-
  Cross-cutting navigation for portfolio gaps and supply-chain attack-stage
  handoffs. Relationships are not control coverage, adoption, or compliance.
sources:
  - source_ref: REF-PORTFOLIO-001
    role: portfolio-completeness-and-navigation
  - source_ref: LOCAL-SUPPLY-CHAIN-ATTACK-STAGES
    role: attack-path-and-control-handoff-analysis
relationship_types:
  direct: the artifact defines an outcome at this layer or stage
  adjacent: the artifact supports a boundary but does not own the primary outcome
  handoff: the artifact output must be preserved by a later stage
  gap: the migration pilot has no direct artifact for this layer or stage
lenses:
  - id: product-security-layers
    source_ref: REF-PORTFOLIO-001
    dimensions:
      - application
      - platform-and-infrastructure
      - operations
      - psirt-and-vulnerability-management
      - external-and-supply-chain
      - governance
      - education-and-culture
  - id: supply-chain-attack-stages
    source_ref: LOCAL-SUPPLY-CHAIN-ATTACK-STAGES
    dimensions:
      - stage-01-developer-endpoint-and-local-trust
      - stage-02-source-repository-and-vcs-control-plane
      - stage-03-ai-assisted-development-supply-chain
      - stage-04-dependency-selection-resolution-and-acquisition
      - stage-05-ci-workflow-pr-action-and-cache
      - stage-06-cicd-identity-and-control-plane
      - stage-07-runner-and-build-execution
      - stage-08-build-platform-and-provenance-generation
      - stage-09-artifact-release-signing-and-sbom
      - stage-10-registry-iac-and-deployment-admission
      - stage-11-production-runtime-and-external-exposure
      - stage-12-detection-incident-response-and-recovery
pilot_reconciliation:
  product_security_layers:
    - dimension: application
      relationship: direct
      rationale: Object access design, a bounded SQLite implementation and Unicode source review now exist; HTTP authentication, endpoint coverage, most application controls and protected source-review adoption remain unverified or unmigrated.
    - dimension: platform-and-infrastructure
      relationship: direct
      rationale: Guidance addresses source authority, dependency intake, PR cache runner boundaries, workload federation, build containment, approved builder and consistent release process, infrastructure plan apply and drift, artifact admission, registry publication, container node and daemon boundaries, workload privilege confinement, workload network segmentation, workload resource bounds and scanner evidence; live enforcement remains unverified.
    - dimension: operations
      relationship: direct
      rationale: Runtime detection, triage and credential-containment guidance define observation health, delivery and bounded recovery decisions; live monitoring and response remain unverified.
    - dimension: psirt-and-vulnerability-management
      relationship: direct
      rationale: Supply-chain impact assessment, credential containment and deployed-artifact recovery are defined; intake, disclosure and live capability remain separate.
    - dimension: external-and-supply-chain
      relationship: direct
      rationale: Guidance addresses dependency review identity and execution, extension admission, approved builder and release process, platform provenance generation, artifact signing design, provenance distribution, release SBOM identity and analysis intake, consumer verification, registry publication and deployment artifact admission; live signing remains unverified.
    - dimension: governance
      relationship: direct
      rationale: Exception lifecycle and extension adoption ownership are defined; organization-wide governance and live adoption remain unverified.
    - dimension: education-and-culture
      relationship: adjacent
      rationale: Learning notes provide readable scenario-based navigation to controls and patterns; learner comprehension and attendance are outside repository records.
  supply_chain_attack_stages:
    - dimension: stage-01-developer-endpoint-and-local-trust
      relationship: direct
      rationale: Endpoint management design separates enrollment, current observations and access decisions; source credentials and developer-agent isolation remain distinct boundaries. Live enforcement is unverified.
    - dimension: stage-02-source-repository-and-vcs-control-plane
      relationship: direct
      rationale: Secret publication and Unicode source review define bounded source acceptance; broader code review and control-plane change assurance remain separate.
    - dimension: stage-03-ai-assisted-development-supply-chain
      relationship: direct
      rationale: AI extension admission is defined through reviewed identity, capabilities and revocation; live loading and runtime tool authorization remain unverified.
    - dimension: stage-04-dependency-selection-resolution-and-acquisition
      relationship: direct
      rationale: Dependency cooldown install execution artifact identity and change review define separate intake outcomes.
    - dimension: stage-05-ci-workflow-pr-action-and-cache
      relationship: direct
      rationale: Untrusted PR isolation directly separates contributor-controlled execution and derived state from privileged consumers.
    - dimension: stage-06-cicd-identity-and-control-plane
      relationship: direct
      rationale: Source credential lifecycle and workload federation define identity and exchanged-authority boundaries without covering all control-plane changes.
    - dimension: stage-07-runner-and-build-execution
      relationship: direct
      rationale: Runner lifecycle and build containment records define distinct outcomes; live enforcement and adoption remain unverified.
    - dimension: stage-08-build-platform-and-provenance-generation
      relationship: direct
      rationale: Approved builder and consistent release process design now joins platform provenance generation field sources and authentication; live builder selection execution and provenance remain unverified.
    - dimension: stage-09-artifact-release-signing-and-sbom
      relationship: direct
      rationale: Artifact signing generation, provenance distribution, release and supplier SBOM boundaries, and consumer acceptance are defined; live signing, publication, analysis and consumer verification remain unverified.
    - dimension: stage-10-registry-iac-and-deployment-admission
      relationship: direct
      rationale: Infrastructure plan and apply authorization, exact artifact admission, container registry publication, node image and identity admission, workload privilege confinement, workload network policy preparation and resource budget admission are defined as direct boundaries; target-specific enforcement, rollout and live adoption remain unverified.
    - dimension: stage-11-production-runtime-and-external-exposure
      relationship: direct
      rationale: Provider-observed infrastructure state, node runtime and host management, intended workload confinement, network allow boundaries and resource budgets are handed to runtime detection and external surface reconciliation; live cloud inventory nodes effective profiles CNI cgroup pressure sensors and external collectors remain unverified.
    - dimension: stage-12-detection-incident-response-and-recovery
      relationship: direct
      rationale: Evidence-linked impact assessment, credential containment and deployed-artifact recovery decisions are defined; live mutation and complete recovery remain unverified.
artifact_relationships:
  - artifact_id: IMPL-GITHUB-PUBLIC-INDICATOR-WATCH
    artifact_path: ../engineering/source-protection/public-exposure-observation-and-triage/implementations/github-indicator-watch/README.md
    source_refs: [REF-PUBLIC-SOURCE-EXPOSURE-001]
    product_security_layers:
      - {dimension: operations, relationship: direct, rationale: Collects bounded public-source candidates for human review and selected notification.}
    supply_chain_attack_stages:
      - {dimension: stage-02-source-repository-and-vcs-control-plane, relationship: direct, rationale: Searches public code Issue and PR surfaces for selected organization indicators.}
      - {dimension: stage-12-detection-incident-response-and-recovery, relationship: handoff, rationale: A reviewed candidate can be sent to an operator webhook after manual confirmation.}
    limitations: [No live GitHub search or organization notification is verified; first-page legacy code search is not exact or complete.]
  - artifact_id: PSB-CODE-005
    artifact_path: ../controls/records/secure-coding/psb-code-005-unicode-source-review/README.md
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2, SPEC-UNICODE-SECURITY-MECHANISMS]
    product_security_layers:
      - {dimension: application, relationship: direct, rationale: Defines review of source characters and language interpretation before application code is accepted.}
      - {dimension: platform-and-infrastructure, relationship: adjacent, rationale: Repository and CI acceptance can enforce the chosen check but their own integrity is separate.}
    supply_chain_attack_stages:
      - {dimension: stage-02-source-repository-and-vcs-control-plane, relationship: direct, rationale: Deceptive source text must be surfaced at change review and acceptance.}
      - {dimension: stage-05-ci-workflow-pr-action-and-cache, relationship: handoff, rationale: A protected CI gate can run the check on the reviewed revision.}
      - {dimension: stage-08-build-platform-and-provenance-generation, relationship: handoff, rationale: The accepted source proceeds to build without this control proving build integrity.}
    limitations: [Does not establish full Unicode confusable coverage review UI behavior or protected CI adoption.]
  - artifact_id: ENG-CODE-001
    artifact_path: ../engineering/secure-coding/unicode-source-review/README.md
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2, SPEC-UNICODE-SECURITY-MECHANISMS]
    product_security_layers:
      - {dimension: application, relationship: direct, rationale: Separates source rendering lexical interpretation and identifier policy choices.}
      - {dimension: platform-and-infrastructure, relationship: adjacent, rationale: Places any acceptance gate in repository or CI policy without implementing provider settings.}
    supply_chain_attack_stages:
      - {dimension: stage-02-source-repository-and-vcs-control-plane, relationship: direct, rationale: Designs the review and acceptance decision for the exact source revision.}
      - {dimension: stage-05-ci-workflow-pr-action-and-cache, relationship: handoff, rationale: Hands the chosen scanner and scope to a protected CI execution path.}
    limitations: [No editor rendering integration or live merge gate has been verified.]
  - artifact_id: IMPL-PYTHON-UNICODE-SOURCE-CHECK
    artifact_path: ../engineering/secure-coding/unicode-source-review/implementations/python/README.md
    source_refs: [SPEC-PYTHON-SOURCE-LEXICAL-3-10]
    product_security_layers:
      - {dimension: application, relationship: direct, rationale: Inspects actual Python source code points and identifier spellings under a narrow project profile.}
    supply_chain_attack_stages:
      - {dimension: stage-02-source-repository-and-vcs-control-plane, relationship: direct, rationale: Reports selected deceptive characters before code acceptance when installed at that point.}
      - {dimension: stage-05-ci-workflow-pr-action-and-cache, relationship: handoff, rationale: Can be called from CI while protected workflow policy remains an adoption task.}
    limitations: [Only tested on Python 3.10.4 UTF-8 files; no protected CI or review UI integration.]
  - artifact_id: PSB-BUILD-002
    artifact_path: ../controls/records/build-security/psb-build-002-approved-consistent-build/README.md
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
    product_security_layers:
      - {dimension: platform-and-infrastructure, relationship: direct, rationale: Defines producer-approved builder and release process selection at the build platform boundary.}
      - {dimension: external-and-supply-chain, relationship: handoff, rationale: Provides exact output and process expectations for provenance distribution and consumer acceptance.}
    supply_chain_attack_stages:
      - {dimension: stage-02-source-repository-and-vcs-control-plane, relationship: handoff, rationale: Receives reviewed source and build definition revisions without owning source change approval.}
      - {dimension: stage-07-runner-and-build-execution, relationship: handoff, rationale: Selects the intended build execution route while containment and runner lifecycle are separate.}
      - {dimension: stage-08-build-platform-and-provenance-generation, relationship: direct, rationale: Owns producer selection of the builder consistent process and release promotion decision.}
      - {dimension: stage-09-artifact-release-signing-and-sbom, relationship: handoff, rationale: Passes exact output identity and build evidence to signature provenance and publication boundaries.}
    limitations: [No build platform capability live run provenance origin or publish gate was verified.]
  - artifact_id: ENG-BUILD-003
    artifact_path: ../engineering/build-security/approved-release-build-process/README.md
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
    product_security_layers:
      - {dimension: platform-and-infrastructure, relationship: direct, rationale: Designs builder assessment versioned definition external input and protected promotion paths.}
      - {dimension: external-and-supply-chain, relationship: handoff, rationale: Connects producer build expectations to independent artifact consumers.}
    supply_chain_attack_stages:
      - {dimension: stage-02-source-repository-and-vcs-control-plane, relationship: handoff, rationale: Requires immutable reviewed source and definition inputs.}
      - {dimension: stage-07-runner-and-build-execution, relationship: handoff, rationale: Distinguishes the chosen builder from runtime containment and runner isolation.}
      - {dimension: stage-08-build-platform-and-provenance-generation, relationship: direct, rationale: Places producer selection consistent invocation platform-origin evidence and release gate.}
      - {dimension: stage-09-artifact-release-signing-and-sbom, relationship: handoff, rationale: Hands promoted artifact digest and build evidence to release integrity.}
    limitations: [No platform-specific adapter and no live capability or release promotion test were added.]
  - artifact_id: PSB-REL-005
    artifact_path: ../controls/records/release-integrity/psb-rel-005-artifact-signing-generation/README.md
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
    product_security_layers:
      - {dimension: external-and-supply-chain, relationship: direct, rationale: Defines exact approved artifact signing bounded authority and consumer-retrievable verification material.}
      - {dimension: platform-and-infrastructure, relationship: adjacent, rationale: Relies on CI identity signing service and key custody without owning those platforms entirely.}
      - {dimension: operations, relationship: handoff, rationale: Signing key changes failures and release evidence require owned operations and response.}
    supply_chain_attack_stages:
      - {dimension: stage-06-cicd-identity-and-control-plane, relationship: handoff, rationale: Receives a bounded workload identity but must still authorize the artifact subject.}
      - {dimension: stage-08-build-platform-and-provenance-generation, relationship: handoff, rationale: Receives the final artifact identity without establishing build provenance.}
      - {dimension: stage-09-artifact-release-signing-and-sbom, relationship: direct, rationale: Owns approved subject signing verification material publication and release completion.}
      - {dimension: stage-10-registry-iac-and-deployment-admission, relationship: handoff, rationale: Hands artifact and signature identities to later consumer gates without deciding acceptance.}
    limitations: [No live signer key policy artifact publication consumer retrieval or release gate was verified.]
  - artifact_id: ENG-REL-005
    artifact_path: ../engineering/release-integrity/artifact-signing-boundary/README.md
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
    product_security_layers:
      - {dimension: external-and-supply-chain, relationship: direct, rationale: Designs the producer boundary from approved artifact digest to signing and publication.}
      - {dimension: platform-and-infrastructure, relationship: adjacent, rationale: Compares signer authority and key custody choices without implementing a provider.}
    supply_chain_attack_stages:
      - {dimension: stage-06-cicd-identity-and-control-plane, relationship: handoff, rationale: Separates workload authentication from authority to sign this release subject.}
      - {dimension: stage-08-build-platform-and-provenance-generation, relationship: handoff, rationale: Requires final artifact bytes and does not infer provenance from a signature.}
      - {dimension: stage-09-artifact-release-signing-and-sbom, relationship: direct, rationale: Defines the signer verification publication and fail-closed gate design.}
      - {dimension: stage-10-registry-iac-and-deployment-admission, relationship: handoff, rationale: Passes exact subject and verification material for consumer-owned decisions.}
    limitations: [No provider-specific implementation is selected and local cryptographic fixtures do not prove live signing authority or publication.]
  - artifact_id: PSB-REL-004
    artifact_path: ../controls/records/release-integrity/psb-rel-004-supplier-sbom-intake-trust/README.md
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
    product_security_layers:
      - {dimension: external-and-supply-chain, relationship: direct, rationale: Defines supplier SBOM origin exact product and artifact binding quarantine and bounded import before inventory use.}
      - {dimension: operations, relationship: handoff, rationale: Trust-source outages signer changes corrections and withdrawals require owned re-evaluation.}
      - {dimension: psirt-and-vulnerability-management, relationship: handoff, rationale: Supplies accepted or unevaluated inventory states without deciding vulnerability applicability or response.}
    supply_chain_attack_stages:
      - {dimension: stage-04-dependency-selection-resolution-and-acquisition, relationship: handoff, rationale: Receives an approved supplier and acquired artifact identity without owning component selection.}
      - {dimension: stage-09-artifact-release-signing-and-sbom, relationship: direct, rationale: Owns supplier SBOM authentication subject binding and quarantine before portfolio intake.}
      - {dimension: stage-10-registry-iac-and-deployment-admission, relationship: handoff, rationale: An accepted SBOM does not authorize artifact execution or deployment.}
      - {dimension: stage-12-detection-incident-response-and-recovery, relationship: handoff, rationale: Preserves inventory trust and error states for later impact investigation.}
    limitations: [No supplier signing or delivery method trust source quarantine store or live portfolio import is selected or verified.]
  - artifact_id: ENG-REL-004
    artifact_path: ../engineering/release-integrity/supplier-sbom-intake-boundary/README.md
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
    product_security_layers:
      - {dimension: external-and-supply-chain, relationship: direct, rationale: Designs consumer-owned expectations authenticity exact artifact binding and isolated intake.}
      - {dimension: operations, relationship: handoff, rationale: Defines re-evaluation for signer status correction withdrawal and verification outages.}
    supply_chain_attack_stages:
      - {dimension: stage-04-dependency-selection-resolution-and-acquisition, relationship: handoff, rationale: Starts from a selected supplier and specific acquired product rather than making the procurement decision.}
      - {dimension: stage-09-artifact-release-signing-and-sbom, relationship: direct, rationale: Designs the supplier SBOM trust boundary before normal inventory import.}
      - {dimension: stage-12-detection-incident-response-and-recovery, relationship: handoff, rationale: Hands accepted quarantined and unevaluated inventory states to impact workflows.}
    limitations: [No general-purpose custom envelope implementation was migrated; supplier-specific verification and live isolation remain untested.]
