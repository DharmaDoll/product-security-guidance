    Legacy versions and identifiers are preserved for historical review.
    Reallocated legacy relationships remain migration-review-required.
    New design-reviewed entries record source-text and scope review only,
    not executed verification. Non-inherited legacy relations remain in
    the corresponding migration reconciliation.
