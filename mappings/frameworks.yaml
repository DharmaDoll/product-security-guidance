      disposition: partial-design
    limitation: >-
      The technique also includes development-tool compromise, typosquatting,
      and older malicious packages. Cooldown does not detect malicious code or
      prevent adoption after the wait. DEP-AGE-6 is exception governance, not
      evidence of mitigation. No live resolver enforcement was verified.
