schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-DESIGN-001
title: Object access authorization
domain: secure-design
status: pilot
question: ログイン済みの利用者が対象IDを変えても、他人や別tenantのデータを操作できないか。
direct_failure: ログイン済みの利用者が、他人や別tenantの対象を読み取り、変更する。
threats:
  - 利用者が対象IDを変え、所有者やtenantの境界を越える
  - リクエスト中の所有者情報がサーバー側の認可情報に代わって使われる
security_properties:
  - id: OBJECT-AUTH-1
    statement: 利用者とtenantは、リクエスト中の値ではなく認証済みの情報から取得する。
    source_refs: [REF-APPLICATION-AUTHORIZATION-001]
  - id: OBJECT-AUTH-2
    statement: 対象の所有者とtenantをサーバー側の記録から確認し、要求者と照合する。
    source_refs: [REF-APPLICATION-AUTHORIZATION-001, SPEC-OWASP-ASVS-5.0.0]
  - id: OBJECT-AUTH-3
    statement: 操作ごとに許可を判断し、別の操作の許可を流用しない。
    source_refs: [REF-APPLICATION-AUTHORIZATION-001, SPEC-OWASP-ASVS-5.0.0]
  - id: OBJECT-AUTH-4
    statement: 対象の読取りと変更の条件に、利用者とtenantを結び付ける。
    source_refs: [REF-APPLICATION-AUTHORIZATION-001, SPEC-OWASP-ASVS-5.0.0]
  - id: OBJECT-AUTH-5
    statement: 一覧、検索、batch、非同期処理、cacheからのアクセスにも同じ認可を適用する。
    source_refs: [REF-APPLICATION-AUTHORIZATION-001]
  - id: OBJECT-AUTH-6
    statement: 認可に必要な情報を確認できないときは許可せず、障害として扱う。
    source_refs: [REF-APPLICATION-AUTHORIZATION-001]
