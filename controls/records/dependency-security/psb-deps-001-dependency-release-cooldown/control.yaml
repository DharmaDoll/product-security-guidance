schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-DEPS-001
title: Dependency release cooldown
domain: dependency-security
status: migration-pilot
question: 新しく公開された依存パッケージを、決めた期間が過ぎる前に実行・採用していないか。
direct_failure: 開発者や自動処理が、公開直後または公開時刻を確認できない版を選び、待機の判定前にコードを実行する。
threats:
  - 侵害された公開者やレジストリが不正な版を公開する
  - 自動更新が公開直後の版を選び、端末やCIで実行する
  - 設定の変更や別の依存解決経路で待機条件を迂回する
  - 公開時刻の取得や判定の失敗を採用可能として扱う
security_properties:
  - id: DEP-AGE-1
    statement: 新たに選ぶパッケージの名前、正確なバージョン、取得元レジストリを特定する。
    legacy_check_refs: [COOL-001, COOL-004]
    source_refs: [REF-DEPS-004, SPEC-NPM-REGISTRY-METADATA]
  - id: DEP-AGE-2
    statement: 承認した情報源の公開時刻と信頼できるUTC時刻で、公開後の経過時間を判定する。
    legacy_check_refs: [COOL-001, COOL-004]
    source_refs: [REF-DEPS-004, SPEC-NPM-REGISTRY-METADATA]
  - id: DEP-AGE-3
    statement: レビューした最低待機期間が過ぎるまで、通常経路でその版を採用しない。
    legacy_check_refs: [COOL-001, COOL-003, COOL-009, COOL-010]
    source_refs: [REF-DEPS-004, SPEC-NPM-CLI-11]
  - id: DEP-AGE-4
    statement: 依存パッケージが提供するコードの実行前、かつ変更のマージ前に判定を強制する。
    legacy_check_refs: [COOL-001, COOL-009]
    source_refs: [REF-DEPS-004, SPEC-NPM-CLI-11]
  - id: DEP-AGE-5
    statement: メタデータの欠落、古さ、形式不正、取得失敗、判定処理の失敗を合格にしない。
    legacy_check_refs: [COOL-006]
    source_refs: [REF-DEPS-004, SPEC-NPM-CLI-11, SPEC-NPM-REGISTRY-METADATA]
  - id: DEP-AGE-6
    statement: 緊急例外は対象のパッケージと正確なバージョン、担当者、別の承認者、期限に限定する。
    legacy_check_refs: [COOL-002, COOL-010]
    source_refs: [REF-DEPS-004]
