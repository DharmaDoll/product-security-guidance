schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-DEPS-002
title: Install execution policy
domain: dependency-security
status: migration-pilot
question: Can dependency preparation execute only explicitly reviewed package-controlled code?
direct_failure: An unreviewed install hook or build backend runs with developer or CI authority.
threats:
  - a malicious or compromised dependency publisher supplies executable preparation code
  - broad approval or alternate install inputs bypass execution denial
security_properties:
  - id: DEP-EXEC-1
    statement: Identify install-time execution paths and deny unapproved execution by default.
    legacy_check_refs: [INS-001, INS-002, INS-003]
    source_refs: [SPEC-INSTALL-EXECUTION-POLICY]
  - id: DEP-EXEC-2
    statement: Independently review execution need for an exact package, version, and artifact.
    legacy_check_refs: [INS-004]
    source_refs: [SPEC-INSTALL-EXECUTION-POLICY]
  - id: DEP-EXEC-3
    statement: Prevent broad overrides and alternate inputs from bypassing the denial.
    legacy_check_refs: [INS-001, INS-002, INS-003, INS-004]
    source_refs: [SPEC-INSTALL-EXECUTION-POLICY]
  - id: DEP-EXEC-4
    statement: Missing, malformed, unsupported, or unevaluable enforcement is not a pass.
    legacy_check_refs: [INS-005]
    source_refs: [SPEC-INSTALL-EXECUTION-POLICY]
