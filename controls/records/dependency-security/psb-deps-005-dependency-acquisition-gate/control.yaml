schema_version: 0.1-pilot
artifact_kind: control-record
id: PSB-DEPS-005
title: Dependency acquisition gate
domain: dependency-security
status: pilot
question: 依存パッケージを承認した経路から取得し、拒否対象は開発端末やCIへ届く前に止められるか。
direct_failure: 方針を通らない経路や無検査への切替えから、拒否対象の依存が開発端末やCIへ届く。
security_properties:
  - id: DEP-ACQ-1
    statement: 対象環境、パッケージの種類、取得元、直接URL・キャッシュなどの取得経路と対象外を明示する。
    source_refs: [REF-DEPS-001]
  - id: DEP-ACQ-2
    statement: 対象の取得前に承認済みの取得元と遮断方針を強制し、別設定や直接接続による迂回を許さない。
    source_refs: [REF-DEPS-001]
  - id: DEP-ACQ-3
    statement: 方針適用や接続の失敗を無検査の成功に変えず、対象外・判定不能を確認済みと表示しない。
    source_refs: [REF-DEPS-001]
  - id: DEP-ACQ-4
    statement: 取得した名前・版・取得元と利用先を追跡し、後日問題が判明した対象を調べて担当者へ渡せるようにする。
    source_refs: [REF-DEPS-001]
