question: 今回の依存変更を把握し、拒否対象や未評価の変更をマージ前に止められるか。
direct_failure: 見落とした依存変更や評価できなかった変更が、マージ前の審査を通る。
threats:
  - 開発者や更新ボットが問題のある直接・推移依存を追加する
  - データ不足や任意の検査により、未評価の変更がマージされる
security_properties:
  - id: DEP-REVIEW-1
    statement: 現在のbaseとheadの間で変わった直接・推移依存の版、利用範囲、manifestを示す。
    legacy_check_refs: [DCR-001]
    source_refs: [REF-DEPS-002]
  - id: DEP-REVIEW-2
    statement: 明示した採用方針で判断し、拒否対象を成功扱いにしない。
    legacy_check_refs: [DCR-004]
    source_refs: [REF-DEPS-002]
  - id: DEP-REVIEW-3
    statement: 現在の変更に対する必須の評価をマージ前に終え、未評価や省略を成功表示だけで許可しない。
    legacy_check_refs: [DCR-009]
    source_refs: [REF-DEPS-002]
