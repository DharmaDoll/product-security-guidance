schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-DEPS-004
title: Dependency change review
domain: dependency-security
status: migration-pilot
question: Are current dependency changes visible and can rejected or unevaluated changes merge?
direct_failure: Hidden risky dependency changes or unavailable review results are accepted before merge.
threats:
  - contributor or bot introduces an affected direct or transitive dependency
  - incomplete provider data or optional checks permit unevaluated changes
security_properties:
  - id: DEP-REVIEW-1
    statement: Show supported direct and transitive base-to-head changes with version scope and manifest context.
    legacy_check_refs: [DCR-001]
    source_refs: [REF-DEPS-002]
  - id: DEP-REVIEW-2
    statement: Apply an explicit adoption policy and make rejected changes non-success.
    legacy_check_refs: [DCR-004]
    source_refs: [REF-DEPS-002]
  - id: DEP-REVIEW-3
    statement: Require successful current review before merge and reject all unavailable or non-success states.
    legacy_check_refs: [DCR-009]
    source_refs: [REF-DEPS-002]
