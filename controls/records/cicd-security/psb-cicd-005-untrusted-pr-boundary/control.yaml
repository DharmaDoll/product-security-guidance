schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CICD-005
title: Untrusted PR boundary
domain: cicd-security
status: migration-pilot
question: 外部PRで変えられるコードや成果物から、書き込み権限や秘密情報に届かないか。
direct_failure: PRのコードや実行結果が権限付き処理へ入り、リポジトリやクラウドの権限を使われる。
threats:
  - 悪意ある投稿者がコード、テスト、依存関係、設定を変える
  - 権限付き処理がPRで変えられる内容を読み込み実行する
  - キャッシュ、成果物、出力、作業領域を通じて未信頼の状態が後続処理へ渡る
  - ワークフローやサービス側設定を確認できず、分離できていると誤認する
security_properties:
  - id: PR-BOUNDARY-1
    statement: PR作成者が変えられるコードと状態、その作成元、受け取るすべての処理、各処理の実際の権限を特定する。
    legacy_check_refs: [PRB-003, PRB-004]
    source_refs: [REF-CICD-010]
  - id: PR-BOUNDARY-2
    statement: 未信頼の状態を実行する処理に、書き込み権限、秘密情報、OIDC、保護された環境を渡さない。
    legacy_check_refs: [PRB-001]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-CICD-005, REF-CICD-010]
  - id: PR-BOUNDARY-3
    statement: 未信頼の状態を、永続資産、後続ジョブへ残る状態、権限のある内部ネットワークに届かない場所で実行する。
    legacy_check_refs: [PRB-002]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE]
  - id: PR-BOUNDARY-4
    statement: PRの成果物、キャッシュ、出力、依存関係、再利用ワークフローの状態を、権限付き処理が自動で信頼しない。
    legacy_check_refs: [PRB-004]
    source_refs: [REF-CICD-010, SPEC-CI-CACHE-BOUNDARY]
  - id: PR-BOUNDARY-5
    statement: 権限付き処理はレビュー済みの変更から新しく開始し、未信頼の実行で作ったコードや状態を引き継がない。
    legacy_check_refs: [PRB-005]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-CICD-010]
  - id: PR-BOUNDARY-6
    statement: ワークフロー、サービス側設定、データの流れ、実際の実行を確認できない場合は、合格ではなくNOT_CHECKEDまたはERRORとする。
    legacy_check_refs: [PRB-006]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE]
