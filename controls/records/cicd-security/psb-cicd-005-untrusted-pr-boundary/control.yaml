schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CICD-005
title: Untrusted PR boundary
domain: cicd-security
status: migration-pilot
question: >-
  Can contributor-controlled code and state be kept out of processing that
  can reach repository writes, secrets, OIDC, protected environments,
  persistent runners, internal networks, or trusted downstream state?
direct_failure: >-
  Untrusted code or derived state executes in, or is promoted into, a context
  that can exercise valuable authority or poison a privileged consumer.
threats:
  - a malicious or compromised contributor changes code, tests, dependencies, workflow inputs, or indirect loading paths
  - a privileged event checks out or executes contributor-controlled state
  - a cache, artifact, output, workspace, or dependency promotes untrusted executable state across runs
  - incomplete workflow inventory or inaccessible provider settings create false assurance
security_properties:
  - id: PR-BOUNDARY-1
    statement: Identify contributor-controlled code and state, its producers, every consumer, and each consumer's effective authority.
    legacy_check_refs: [PRB-003, PRB-004]
    source_refs: [REF-CICD-010]
  - id: PR-BOUNDARY-2
    statement: Remove write authority, secrets, OIDC, and protected environments from processing that executes untrusted state.
    legacy_check_refs: [PRB-001]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-CICD-005, REF-CICD-010]
  - id: PR-BOUNDARY-3
    statement: Run untrusted state without persistent assets, cross-job residue, or privileged internal network reachability.
    legacy_check_refs: [PRB-002]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE]
  - id: PR-BOUNDARY-4
    statement: Do not automatically promote untrusted artifacts, caches, outputs, dependencies, or reusable-workflow state into privileged processing.
    legacy_check_refs: [PRB-004]
    source_refs: [REF-CICD-010]
  - id: PR-BOUNDARY-5
    statement: Start privileged processing from a newly trusted revision without inheriting unverified executable state from the untrusted run.
    legacy_check_refs: [PRB-005]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-CICD-010]
  - id: PR-BOUNDARY-6
    statement: Treat incomplete workflow, provider-setting, data-flow, or live-run verification as NOT_CHECKED or ERROR rather than PASS.
    legacy_check_refs: [PRB-006]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE]
