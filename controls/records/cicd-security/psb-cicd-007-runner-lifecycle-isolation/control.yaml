{
  "schema_version": "0.1-pilot",
  "artifact_kind": "control-record",
  "id": "PSB-CICD-007",
  "title": "Runner lifecycle isolation",
  "domain": "cicd-security",
  "status": "migration-pilot",
  "question": "前のjobの状態やhostの権限を次のjobへ渡さず、実行環境を破棄できるか。",
  "direct_failure": "前のjobが残したprocessやファイル、hostの権限が次のjobへ届く。",
  "threats": [
    "悪意あるjobや改変されたrunner imageが、次のjobへprocessやファイルを残す。",
    "Jobからhostの認証情報、cloud metadata、管理用socketやserviceへ到達する。",
    "広いrunner登録権限や管理経路を使い、攻撃者がrunnerを登録・操作し続ける。"
  ],
  "security_properties": [
    {
      "id": "RUNNER-1",
      "statement": "未信頼jobを組織のself-hosted資産へ割り当てず、runnerを使えるrepositoryとworkflowを限定する。",
      "legacy_check_refs": [
        "RNR-001"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-2",
      "statement": "Jobごとに新しい実行環境を使い、終了した環境を再利用しない。",
      "legacy_check_refs": [
        "RNR-002"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-3",
      "statement": "承認済みimageと対応するrunner版を使い、更新時にjobが変えた状態を引き継がない。",
      "legacy_check_refs": [
        "RNR-003"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-4",
      "statement": "起動時に前jobのworkspace、process、host・cloudの認証情報やSSH keyがないことを確認する。",
      "legacy_check_refs": [
        "RNR-004"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-5",
      "statement": "不要なcloud metadata、host管理socket、管理・内部networkへの到達を拒否する。",
      "legacy_check_refs": [
        "RNR-005"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-6",
      "statement": "登録権限を対象と期間へ限定し、jobから使わせず、緊急時の対話型管理を分ける。",
      "legacy_check_refs": [
        "RNR-006"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-7",
      "statement": "Jobとrunner世代に対応させ、登録解除とcompute・保存領域・processの破棄を確認する。",
      "legacy_check_refs": [
        "RNR-007"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-8",
      "statement": "調査用ログを破棄前にrunnerの外へ保存し、job IDとrunner世代で照合する。",
      "legacy_check_refs": [
        "RNR-008"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-9",
      "statement": "欠落・古い・部分的・失敗した観測を合格にせず、安全性や破棄状態が不明な世代を再利用しない。",
      "legacy_check_refs": [
        "RNR-009"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    }
  ],
