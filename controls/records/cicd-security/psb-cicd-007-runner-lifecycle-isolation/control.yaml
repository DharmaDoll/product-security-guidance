{
  "schema_version": "0.1-pilot",
  "artifact_kind": "control-record",
  "id": "PSB-CICD-007",
  "title": "Runner lifecycle isolation",
  "domain": "cicd-security",
  "status": "migration-pilot",
  "question": "Does each job use an isolated approved runner generation whose assets are destroyed and whose logs survive?",
  "direct_failure": "Malicious job or implanted runner image leaves processes workspace state or tooling that affects a later job.",
  "threats": [
    "Malicious job or implanted runner image leaves processes workspace state or tooling that affects a later job.",
    "Job code reaches host credentials cloud metadata runtime sockets or management services outside the intended CI boundary.",
    "Reusable registration authority broad runner groups or interactive ingress lets an attacker register control or persist on a runner."
  ],
  "security_properties": [
    {
      "id": "RUNNER-1",
      "statement": "Keep untrusted jobs off organizational self-hosted assets; restrict managed runner access to the intended repositories and workflows.",
      "legacy_check_refs": [
        "RNR-001"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-2",
      "statement": "Use one fresh execution-environment generation per job and never return a completed generation to a reusable pool.",
      "legacy_check_refs": [
        "RNR-002"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-3",
      "statement": "Use currently approved images and supported runner software; review updates and replace generations without carrying forward job-controlled state.",
      "legacy_check_refs": [
        "RNR-003"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-4",
      "statement": "clean workspace no previous job foreign process host credential cloud credential or SSH key",
      "legacy_check_refs": [
        "RNR-004"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-5",
      "statement": "Deny unnecessary access to cloud metadata, host management sockets, and management or internal networks across applicable access paths.",
      "legacy_check_refs": [
        "RNR-005"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-6",
      "statement": "Limit registration authority to its intended scope and duration, keep it out of job-controlled processing, and separate emergency interactive management.",
      "legacy_check_refs": [
        "RNR-006"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-7",
      "statement": "Correlate the job and runner generation with deregistration and confirmed destruction of its compute, storage, and processes; deregistration alone is insufficient.",
      "legacy_check_refs": [
        "RNR-007"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-8",
      "statement": "investigation logs exported outside the runner before destruction and correlated by job ID and runner generation",
      "legacy_check_refs": [
        "RNR-008"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    },
    {
      "id": "RUNNER-9",
      "statement": "Keep missing, stale, partial, or failed observations distinct from success; never reuse a generation whose safety or destruction status is unknown.",
      "legacy_check_refs": [
        "RNR-009"
      ],
      "source_refs": [
        "REF-CICD-014"
      ]
    }
  ],
