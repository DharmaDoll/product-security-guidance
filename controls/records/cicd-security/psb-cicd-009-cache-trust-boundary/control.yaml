{
  "schema_version": "0.1-pilot",
  "artifact_kind": "control-record",
  "id": "PSB-CICD-009",
  "title": "Cache trust boundary",
  "domain": "cicd-security",
  "status": "migration-pilot",
  "question": "Can reused cache state cross into a higher-trust consumer?",
  "direct_failure": "An untrusted or compromised cache producer stores executable or dependency state that a later privileged workflow restores and executes.",
  "threats": [
    "An untrusted or compromised cache producer stores executable or dependency state that a later privileged workflow restores and executes.",
    "A broad key partial match or restore prefix selects cache state created for another workflow purpose platform runtime or dependency graph.",
    "A cache hit causes the consumer to skip dependency integrity verification or execute an installed tree build output tool or hook directly from cache.",
    "Missing workflow inventory inaccessible provider state or failed live tests are treated as proof that cache isolation is active."
  ],
  "security_properties": [
    {
      "id": "CACHE-1",
      "statement": "Restrict download-cache writes to reviewed, explicitly permitted producers.",
      "legacy_check_refs": [
        "CAC-001"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-2",
      "statement": "Identify reusable content by purpose, schema, OS, architecture, runtime, and a non-empty reviewed lock digest; do not accept a non-exact lookup result.",
      "legacy_check_refs": [
        "CAC-002"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-3",
      "statement": "Allow untrusted pull-request processing only to restore; prevent it from writing into any cache scope consumed by trusted processing.",
      "legacy_check_refs": [
        "CAC-003"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-4",
      "statement": "cache paths are limited to reviewed package download stores and exclude credentials source installed dependency trees environments tools build output plugins startup files and PATH directories",
      "legacy_check_refs": [
        "CAC-004"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-5",
      "statement": "Discard failed, partial, or non-exact restores before clean acquisition; an exact hit still requires reviewed artifact hashes and dependency consistency checks before use.",
      "legacy_check_refs": [
        "CAC-005"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-6",
      "statement": "Privileged release, deployment, and signing processing must not consume this CI download cache, directly or through setup actions or called workflows.",
      "legacy_check_refs": [
        "CAC-006"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-7",
      "statement": "Do not claim adoption when producer or consumer inventory, effective access, or current behavior is missing, stale, partial, or unavailable; keep NOT_CHECKED and ERROR distinct from success.",
      "legacy_check_refs": [
        "CAC-007"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    }
  ],
