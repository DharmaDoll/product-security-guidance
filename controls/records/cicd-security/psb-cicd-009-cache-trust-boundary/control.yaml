{
  "schema_version": "0.1-pilot",
  "artifact_kind": "control-record",
  "id": "PSB-CICD-009",
  "title": "Cache trust boundary",
  "domain": "cicd-security",
  "status": "migration-pilot",
  "question": "CIのcacheを誰が保存し、どのjobが復元して使うか把握しているか。",
  "direct_failure": "未信頼の保存者が置いたファイルを、後の権限付きjobが復元して実行する。",
  "threats": [
    "未信頼または侵害されたjobが、後の権限付きjobに使わせるファイルを保存する。",
    "広いkeyやprefix一致で、別用途・環境・依存構成のcacheを復元する。",
    "Cache hitを理由に依存の照合を省き、展開済み環境やtoolをそのまま実行する。",
    "Workflowやproviderの状態を確認できないのに、cacheの分離が有効と扱う。"
  ],
  "security_properties": [
    {
      "id": "CACHE-1",
      "statement": "取得ファイル用cacheへの保存を、レビューした処理に限定する。",
      "legacy_check_refs": [
        "CAC-001"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-2",
      "statement": "用途、形式の版、OS、architecture、runtime、空でないlock digestで対象を識別し、完全一致しない結果を使わない。",
      "legacy_check_refs": [
        "CAC-002"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-3",
      "statement": "未信頼PRは復元だけを許可し、信頼済み処理が使う範囲へ保存させない。",
      "legacy_check_refs": [
        "CAC-003"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-4",
      "statement": "保存pathをレビューした取得ファイルに限定し、認証情報、ソース、展開済み環境、tool、build出力、plugin、起動用ファイル、PATH上のディレクトリを含めない。",
      "legacy_check_refs": [
        "CAC-004"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-5",
      "statement": "失敗・部分的・不一致の復元結果は使わず、完全一致でも利用前に承認hashと依存関係を照合する。",
      "legacy_check_refs": [
        "CAC-005"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-6",
      "statement": "公開・deploy・署名のjobは、このCI cacheを直接にもsetup Actionや呼出先経由にも使わない。",
      "legacy_check_refs": [
        "CAC-006"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    },
    {
      "id": "CACHE-7",
      "statement": "保存者・利用者、実効権限、現在の挙動が欠落・古い・部分的・確認不能なら導入済みと扱わない。",
      "legacy_check_refs": [
        "CAC-007"
      ],
      "source_refs": [
        "SPEC-CI-CACHE-BOUNDARY"
      ]
    }
  ],
