  "title": "Security exception lifecycle",
  "domain": "governance-operations",
  "status": "migration-pilot",
  "check_context_version": "1.0",
  "question": "Can every security exception remain exact independently approved time-bound and fail-closed at its enforcement point?",
  "direct_failure": "An ambiguous self-approved permanent or unverifiable exception disables security enforcement beyond the reviewed risk decision.",
  "security_properties": [
    {
      "id": "EXCEPTION-1",
      "statement": "every exception names one existing control and check pair plus an exact allowed target type target identifier and environment without wildcard scope",
      "legacy_check_refs": [
        "GEX-001"
      ],
      "applies_to": [
        "security-exception",
        "control-catalog",
        "enforcement-target"
      ],
      "context": {
        "threat_actor": "contributor operator or approver using a broad selector accidentally or to bypass unrelated security decisions",
        "attack_or_failure_scenario": "one approved case suppresses all scanner findings dependencies repositories builds or environments because its scope is ambiguous",
        "why_required": "an exception can be safely evaluated only when the authorized decision and the enforcement target use the same exact identifiers"
      },
      "source_refs": [
        "REF-SECURITY-EXCEPTION-LIFECYCLE-001"
      ]
    },
    {
      "id": "EXCEPTION-2",
      "statement": "owner risk reviewer and approver are stable non-wildcard team identities and no one identity fills multiple decision roles",
      "legacy_check_refs": [
        "GEX-002"
      ],
      "applies_to": [
        "risk-acceptance",
        "approval-workflow"
      ],
      "context": {
        "threat_actor": "control owner under delivery pressure compromised identity or insider seeking an unreviewed bypass",
        "attack_or_failure_scenario": "the person benefiting from disabled enforcement also evaluates and approves the accepted risk",
        "why_required": "separation of duties adds an independent challenge and records who remains accountable for risk and approval"
      },
      "source_refs": [
        "REF-SECURITY-EXCEPTION-LIFECYCLE-001"
      ]
    },
    {
      "id": "EXCEPTION-3",
      "statement": "meaningful justification and risk statements name non-empty compensating controls and distinct exact approval and remediation tickets",
      "legacy_check_refs": [
        "GEX-003"
      ],
      "applies_to": [
        "risk-analysis",
        "compensating-control",
        "remediation-plan"
      ],
      "context": {
        "threat_actor": "rushed decision maker or attacker hiding a bypass behind an empty generic or unactionable exception record",
        "attack_or_failure_scenario": "reviewers cannot determine what risk was accepted how exposure is reduced or which tracked work will remove the exception",
        "why_required": "exception expiry alone does not create a risk response unless interim protection and accountable remediation are reviewable"
      },
      "source_refs": [
        "REF-SECURITY-EXCEPTION-LIFECYCLE-001"
      ]
    },
    {
      "id": "EXCEPTION-4",
      "statement": "creation precedes expiry lifetime stays within policy and evaluation time independently derives active expiring or expired state",
