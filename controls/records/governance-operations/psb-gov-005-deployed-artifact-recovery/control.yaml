schema_version: 0.1-pilot
artifact_kind: control-record
id: PSB-GOV-005
title: Deployed artifact recovery
domain: governance-operations
status: migration-pilot
question: 影響を受けた稼働中の成果物を置き換え、古い成果物がもう動いていないと確かめられるか。
direct_failure: 再ビルドや一部環境への配布だけで復旧済みとし、古い成果物が稼働中または再投入可能な状態を残す。
threats:
- 新しい脆弱性やサポート終了などで稼働成果物が使えなくなる
- 同じ内容や根拠の欠けた再ビルドを置換済みと扱う
- 一部の環境だけを更新し、古い成果物が残る
- 検査や稼働状況の取得失敗を復旧済みと扱う
security_properties:
- id: ARTIFACT-RECOVERY-1
  statement: 稼働先、停止中の再起動経路、切り戻し先、digest、成果物に結び付いたSBOM、観測時刻、未確認の範囲を一つの復旧案件に記録する。
  legacy_check_refs: [DAR-001]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
- id: ARTIFACT-RECOVERY-2
  statement: 対象のdigestと部品について、脆弱性の適用性、サポート、ベースイメージ、レジストリの状態と情報取得の成否を確認する。
  legacy_check_refs: [DAR-002]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
- id: ARTIFACT-RECOVERY-3
  statement: 影響する成果物ごとに担当者、判断理由、期限、対象環境、再ビルド条件、例外や切り戻しの条件を決める。脆弱性ではGOV-003の期限を引き継ぐ。
  legacy_check_refs: [DAR-003]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
- id: ARTIFACT-RECOVERY-4
  statement: 新しいdigestを、レビューしたソース、ビルドの実行、来歴、署名、成果物に結び付いたSBOM、公開判断と照合する。
  legacy_check_refs: [DAR-004]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
- id: ARTIFACT-RECOVERY-5
  statement: 置換する環境では承認したdigestと公開・受入・実際の稼働状態を照合する。廃止する環境では停止と再起動経路を確認し、一覧からの消失だけで完了にしない。
  legacy_check_refs: [DAR-005]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
- id: ARTIFACT-RECOVERY-6
  statement: 元の調査範囲を再び確認し、古いdigestが稼働せず、停止中の再起動や切り戻しでも戻らないことを、新しい成果物の成功とは別に確かめる。
  legacy_check_refs: [DAR-006]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
- id: ARTIFACT-RECOVERY-7
  statement: 非該当、対応中、期限超過、復旧済み、セキュリティ上の失敗、証拠の取得失敗を分け、欠落・古さ・一部取得・通知失敗があれば案件を閉じない。
  legacy_check_refs: [DAR-007]
  source_refs: [REF-DEPLOYED-ARTIFACT-RECOVERY-001]
links:
  learning: learning.md
  engineering_pattern: ../../../../engineering/governance-operations/deployed-artifact-recovery/README.md
  mapping: ../../../../mappings/pilot.yaml
  framework_mapping: ../../../../mappings/frameworks.yaml
  sources: ../../../../sources/README.md
  migration_reconciliation: ../../../../docs/MIGRATION_GOVERNANCE_OPERATIONS.md
limitations:
- ガイダンスと診断項目であり、実際の再ビルド、公開、受入、配布、稼働状況は確認していない。
- 来歴の生成やデプロイ時の受入に残る空白があり、一連の運用を実装済みとは言えない。
- 新しい成果物にも未知の脆弱性や悪意ある変更は残り得る。
