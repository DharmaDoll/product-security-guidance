schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-DETECT-003
title: External attack surface reconciliation
domain: detection-verification
status: pilot
question: 自組織が責任を持つ公開サービスに、台帳にないものや意図しないものが見つかったら、担当者へ渡せるか。
direct_failure: 未登録・意図しない・再出現した公開サービスが、収集漏れや帰属の誤りによって調査されない。
threats:
  - 担当者が知らない公開サービスを第三者が先に見つける
  - 台帳や収集元の障害が候補0件として扱われ、意図しない公開が隠れる
  - 委託先を指す名前を理由に、無関係な第三者の基盤を調査する
security_properties:
  - id: EASM-1
    statement: 観測範囲ごとに管理責任、担当者、許可された収集・確認方法を明らかにする。
    source_refs: [REF-EXTERNAL-SURFACE-001]
  - id: EASM-2
    statement: 観測元、範囲、時刻、取得状態を残し、不完全・古い・失敗した収集を正常な0件にせず、以前の候補も消さない。
    source_refs: [REF-EXTERNAL-SURFACE-001]
  - id: EASM-3
    statement: 候補と観測元を結び、自組織の名前、委託先、共有基盤、帰属不明を区別する。
    source_refs: [REF-EXTERNAL-SURFACE-001]
  - id: EASM-4
    statement: 観測結果を台帳上の公開予定やサービスと照合し、未登録・意図しない公開を調査へ渡す。
    source_refs: [REF-EXTERNAL-SURFACE-001]
  - id: EASM-5
    statement: 候補の変化と是正後の再出現を追い、検索結果から消えただけで調査を閉じない。
    source_refs: [REF-EXTERNAL-SURFACE-001]
  - id: EASM-6
    statement: 能動的な確認は許可された対象と方法に限り、ドメインとの関係から第三者の共有基盤への調査権限を推定しない。
    source_refs: [REF-EXTERNAL-SURFACE-001]
  - id: EASM-7
    statement: 保存・通知する証拠は担当者の判断に必要な範囲に絞り、認証情報、応答本文、不要な個人情報を広めない。
    source_refs: [REF-EXTERNAL-SURFACE-001]
