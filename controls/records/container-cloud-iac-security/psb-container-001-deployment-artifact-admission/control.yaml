schema_version: 0.1-pilot
artifact_kind: control-record
id: PSB-CONTAINER-001
title: Deployment artifact admission
domain: container-cloud-iac-security
status: migration-pilot
question: 実行する全成果物を現在の受入条件へ結び付け、合わなければ起動を止められるか。
direct_failure: 差し替えられた、未評価の、または使用停止した成果物が実行される。
threats: [成果物の差替え, 別成果物の証拠の流用, 実行物の列挙漏れ, 許可判定の迂回, 古い判断結果, 評価器の障害]
security_properties:
- {id: ARTIFACT-ADMIT-1, statement: 全実行物をrepositoryとdigestで特定し、複数platformのimage indexから選ばれるmanifestまで追う。, legacy_check_refs: [CNT-001], source_refs: [REF-DEPLOYMENT-ARTIFACT-ADMISSION-001]}
- {id: ARTIFACT-ADMIT-2, statement: 利用者が署名・来歴・builder・source・入力を評価した現在の判断を、正確なdigestと対象環境へ結び付ける。, legacy_check_refs: [CNT-002], source_refs: [REF-DEPLOYMENT-ARTIFACT-ADMISSION-001]}
- {id: ARTIFACT-ADMIT-3, statement: 実行へ渡す最終状態を評価し、mutation・tag再解決・判断結果の再利用による差替えを防ぐ。, legacy_check_refs: [CNT-001, CNT-002, CNT-009], source_refs: [REF-DEPLOYMENT-ARTIFACT-ADMISSION-001]}
- {id: ARTIFACT-ADMIT-4, statement: 作成・更新・rollback・controller・直接作成・subresource・API versionなど全経路で同じ強制を行う。, legacy_check_refs: [CNT-009], source_refs: [REF-DEPLOYMENT-ARTIFACT-ADMISSION-001]}
- {id: ARTIFACT-ADMIT-5, statement: 成果物・証拠・policy・評価の欠落・不一致・期限切れ・取得失敗を許可と区別し、通常の実行を止める。, legacy_check_refs: [CNT-002, CNT-009], source_refs: [REF-DEPLOYMENT-ARTIFACT-ADMISSION-001]}
- {id: ARTIFACT-ADMIT-6, statement: 許可結果を成果物群・対象・policy版・trust profile・判断ID・時刻へ結び付け、変更・失効・再評価と監査を管理する。, legacy_check_refs: [CNT-009], source_refs: [REF-DEPLOYMENT-ARTIFACT-ADMISSION-001]}
links:
  learning: learning.md
  engineering_pattern: ../../../../engineering/container-cloud-iac-security/deployment-artifact-admission-boundary/README.md
  mapping: ../../../../mappings/pilot.yaml
  framework_mapping: ../../../../mappings/frameworks.yaml
  sources: ../../../../sources/README.md
  migration_reconciliation: ../../../../docs/MIGRATION_CONTAINER_CLOUD_IAC.md
limitations:
- Guidance and diagnostic viewpoints only; no admission controller registry evidence service consumer verifier or runtime was configured or tested.
- Workload confinement registry lifecycle host hardening runtime digest observation and post-admission detection remain separate outcomes.
