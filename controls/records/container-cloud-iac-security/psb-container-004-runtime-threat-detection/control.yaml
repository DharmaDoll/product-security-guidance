  "id": "PSB-CONTAINER-004",
  "title": "Runtime threat detection",
  "domain": "container-cloud-iac-security",
  "status": "migration-pilot",
  "question": "Can runtime anomalies be bound to the correct workload and observation scope, kept distinct from telemetry failure, and handed to an owner for a separate response decision?",
  "direct_failure": "A runtime anomaly is missed, attributed to the wrong workload, hidden by observation failure, or turned into an unauthorized destructive response.",
  "threats": [
    "A compromised or malicious workload starts unexpected processes modifies protected files escalates privileges crosses runtime boundaries communicates with denied destinations or exhausts resources after admission.",
    "A runtime event is attributed to the wrong workload or to a mutable image identity and causes incorrect triage or response.",
    "Sensor outage event drop rule removal forwarding failure or malformed input is interpreted as an event-free clean result.",
    "A detection triggers destructive action without independent authorization or leaks sensitive raw command and payload content into evidence."
  ],
  "security_properties": [
