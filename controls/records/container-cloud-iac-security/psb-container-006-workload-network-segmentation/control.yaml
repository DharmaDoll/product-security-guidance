schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CONTAINER-006
title: Workload network segmentation
domain: container-cloud-iac-security
status: pilot
question: Workloadが侵害されても、必要な相手以外への通信を実際に止められるか。
direct_failure: 隔離の欠落や迂回により、侵害されたworkloadが別workloadや外部へ接続する。
threats:
  - 侵害されたworkloadが隣接workloadや基盤serviceへ接続する
  - 制限のない外向き通信で外部からの操作や情報の持出しが可能になる
  - Policyの配置漏れ・selector漏れ・未対応経路・plugin障害を隔離済みと扱う
security_properties:
  - id: NET-SEG-1
    statement: 必要な通信を送信元・宛先・方向・protocol・port・用途・owner・変更理由で定める。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
  - id: NET-SEG-2
    statement: 全管理対象のingress・egressを既定で拒否し、新規namespaceやselector漏れを全許可にしない。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
  - id: NET-SEG-3
    statement: 送信元egressと宛先ingressの両方で必要最小限を許し、identity用のlabel等を守る。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
  - id: NET-SEG-4
    statement: DNS・管理面・identity・監視・healthの通信を個別に定め、広い許可へ戻さない。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
  - id: NET-SEG-5
    statement: 異なるzoneや外部宛ての通信を、宛先を正しく表せる境界で制限する。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
  - id: NET-SEG-6
    statement: 選んだnetwork実装のprotocol・IPv4／IPv6・workload・既知の迂回経路への強制範囲を確認する。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
  - id: NET-SEG-7
    statement: 許可・拒否を両側から試し、反映待ち・観測失敗を遮断と区別し、例外の対象と期限を限定する。
    source_refs: [REF-WORKLOAD-NETWORK-SEGMENTATION-001]
