schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CONTAINER-005
title: Workload privilege confinement
domain: container-cloud-iac-security
status: pilot
question: Can a compromised workload be prevented from crossing the intended process kernel host filesystem and control-plane authority boundaries?
direct_failure: A compromised workload gains unnecessary host kernel filesystem runtime or control-plane authority through its effective runtime configuration.
threats:
  - application code execution inherits privileged root capability-rich or host-attached workload settings
  - an init sidecar ephemeral or debug path bypasses the confinement applied to the main container
  - an enforcement error unsupported object or broad exemption becomes an ordinary allow decision
security_properties:
  - id: WORKLOAD-CONFINE-1
    statement: Enumerate every executable container path and evaluate the final workload with an OS-aware runtime confinement profile.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-2
    statement: Deny privileged root and privilege-escalating execution by default and declare the required workload identity.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-3
    statement: Drop kernel capabilities by default and apply a runtime-default-or-stricter syscall profile and available mandatory access control.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-4
    statement: Deny host namespaces processes paths devices ports runtime sockets and node-management attachment by default.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-5
    statement: Keep the image root filesystem read-only and restrict writes to explicit purpose-bound volumes.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-6
    statement: Do not inject control-plane credentials unless required and bind any required identity to minimum authority audience and lifetime.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-7
    statement: Enforce the final workload on create update ephemeral and debug paths fail closed on evaluation errors and bind exceptions to exact expiring scope.
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
