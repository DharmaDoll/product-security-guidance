schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CONTAINER-005
title: Workload privilege confinement
domain: container-cloud-iac-security
status: pilot
question: Workloadが侵害されても、不要なroot・kernel・hostの権限を使えないか。
direct_failure: 侵害されたworkloadが実行時の設定を通じてhostや管理面の権限を得る。
threats:
  - アプリケーションのコード実行がprivileged・root・host接続の設定を引き継ぐ
  - init・sidecar・ephemeral・debug経路がmain containerの制限を迂回する
  - policy評価失敗、未対応の形式、広い例外が通常の許可になる
security_properties:
  - id: WORKLOAD-CONFINE-1
    statement: 全実行経路を列挙し、対象OSに合う制限を最終的なworkloadへ適用する。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-2
    statement: Privileged・root実行と権限昇格を既定で拒否し、必要な実行identityを明示する。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-3
    statement: 不要なkernel capabilityを落とし、適切なsyscallとMAC profileを適用する。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-4
    statement: Host namespace・process・path・device・port・runtime socketへの接続を既定で拒否する。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-5
    statement: Imageのroot filesystemを読み取り専用にし、書込みを用途が決まったvolumeへ限定する。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-6
    statement: 不要な管理面の認証情報を渡さず、必要なidentityの権限・audience・期限を絞る。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
  - id: WORKLOAD-CONFINE-7
    statement: 作成・更新・debug追加後の最終状態を強制し、評価失敗を許可にせず、例外の対象と期限を限定する。
    source_refs: [REF-WORKLOAD-CONFINEMENT-001]
