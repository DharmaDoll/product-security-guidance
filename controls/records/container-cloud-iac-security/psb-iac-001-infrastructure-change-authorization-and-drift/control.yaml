schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-IAC-001
title: Infrastructure change authorization and drift boundary
domain: container-cloud-iac-security
status: pilot
question: 承認したインフラ変更と、実際に適用されて今ある状態は一致しているか。
direct_failure: レビューした入力・plan・apply・実resourceが結び付かず、禁止した状態や未追跡の変更が残る。
threats:
  - レビュー後にmodule・provider・variable・policy・target・planを変えて古い承認を使う
  - 未確定・未対応・失敗したplan評価を許可として扱う
  - 広いapply権限やconsole・API・別toolでレビュー済みplanを迂回する
  - Applyの途中失敗で一部変更されたのに変更なしとして記録する
  - 管理外resourceや古い観測、危険な自動修正で実状態が承認内容からずれる
security_properties:
  - id: IAC-CHANGE-1
    statement: Source・module・provider・variable・policy・tool・workspace・targetを一つの変更として記録し、固定範囲の限界を示す。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-2
    statement: 資産と脅威からruleを決め、解決済みplanの作成・更新・削除・置換と重要な値を評価する。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-3
    statement: 許可・拒否・人の判断・評価失敗・未対応・不明値・対象漏れを分け、安全性に必要な不明状態をapply前に止めるか別の強制点へ渡す。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-4
    statement: レビューとpolicy判断を入力・target・保存planへ結び付け、機微なplanのアクセス・保持・廃棄を管理する。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-5
    statement: Apply権限をレビュー・plan生成から分け、保護した実行identityの対象・操作・期限・失効・監査を限定する。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-6
    statement: Console・API・SDK・別IaC・別pipeline・緊急経路を列挙し、provider側の拒否か独立した観測へつなぐ。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-7
    statement: Apply成功と途中失敗を分け、provider上の実resourceと管理対象を承認状態へ照合し、管理外・古い・取得不能を区別する。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
  - id: IAC-CHANGE-8
    statement: 例外とdriftをresource・rule・owner・理由・期限・影響へ結び、修正を新しいplanとしてレビューし、自動修正は復旧と証跡保全ができる範囲に限る。
    source_refs: [REF-IAC-CHANGE-BOUNDARY-001]
