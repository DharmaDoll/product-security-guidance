schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CONTAINER-007
title: Workload resource consumption bounds
domain: container-cloud-iac-security
status: pilot
question: Can a faulty or compromised workload be kept within a reviewed resource budget so it cannot exhaust shared capacity unnoticed?
direct_failure: A workload consumes CPU memory process local storage or object capacity beyond its reviewed budget and degrades neighboring workloads the node or the platform.
threats:
  - faulty or compromised code exhausts shared compute memory process or local storage resources
  - replica job debug or object creation paths amplify consumption beyond the reviewed workload budget
  - admission values quota state or synthetic runtime claims are mistaken for effective node and runtime enforcement
security_properties:
  - id: RESOURCE-1
    statement: Define owned resource budgets and overload behavior for every workload or protection boundary without universal fixed values.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-2
    statement: Account for every executable container and local storage path that can consume the protected resources.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-3
    statement: Treat scheduling requests runtime ceilings overcommit throttling OOM and eviction as distinct decisions and outcomes.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-4
    statement: Bound aggregate requests limits and object counts for each tenant or namespace protection boundary.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-5
    statement: Enforce workload and node PID bounds and local storage measurement limits and pressure handling in the selected runtime and node layout.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-6
    statement: Reconcile tenant budgets with node allocatable system reservations pressure thresholds priority failure domains and capacity.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-7
    statement: Enforce final budgets on create update scale resize and debug paths and observe effective limits exhaustion outcomes pressure and evidence failure.
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
