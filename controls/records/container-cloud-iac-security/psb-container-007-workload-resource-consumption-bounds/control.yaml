schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CONTAINER-007
title: Workload resource consumption bounds
domain: container-cloud-iac-security
status: pilot
question: 故障・侵害されたworkloadが共有資源を使い尽くさないよう、予算を強制できるか。
direct_failure: 一つのworkloadがCPU・memory・process・disk・object数の予算を越え、他のworkloadやnodeを停止させる。
threats:
  - 故障・侵害されたコードが共有CPU・memory・process・diskを使い尽くす
  - replica・job・debug・object作成で予算以上の消費を増幅する
  - Admission設定やquota表示を実際のnode・runtime上限と取り違える
security_properties:
  - id: RESOURCE-1
    statement: Workloadや保護範囲ごとにowner、資源の予算、上限到達時の動きを決め、全環境へ同じ値を強制しない。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-2
    statement: 全実行containerとlocal storageの消費経路を予算に含める。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-3
    statement: 配置用request、実行時limit、overcommit、throttle、OOM、evictionを別の判断と結果として扱う。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-4
    statement: Tenant・namespace単位でrequest・limitの合計とobject数を制限する。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-5
    statement: 選んだruntimeとnode構成でPID・local storageの上限、計測範囲、pressure時の扱いを強制する。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-6
    statement: Tenant予算をnodeのallocatable、system予約、pressure閾値、priority、障害範囲の余力と照合する。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
  - id: RESOURCE-7
    statement: 作成・更新・scale・resize・debugでも最終予算を強制し、実効limit、枯渇結果、観測失敗を区別する。
    source_refs: [REF-WORKLOAD-RESOURCE-BOUNDS-001]
