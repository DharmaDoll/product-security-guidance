schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-CODE-005
title: Unicode source review
domain: secure-coding
status: pilot
question: レビュー画面に見えるコードと、言語処理系が読む文字の違いに受入前に気付けるか。
direct_failure: 表示で文字や識別子の実体が隠され、紛らわしい変更がレビューを通る。
threats:
  - 投稿者がコメントや文字列に双方向制御文字を入れ、周囲のコードの表示順を変える
  - 表示上の改行と処理系の改行の違いで、コードの意味を誤認させる
  - 不可視文字でレビュー画面とソース文字の違いを隠す
  - 似た別文字や正規化で変わる識別子を既存の名前と誤認させる
  - 検査がファイルを見落とすか解析に失敗しても、問題なしと報告する
security_properties:
  - id: UNICODE-SOURCE-1
    statement: 対象言語、ファイル、revisionを決め、実際の文字と処理系が読む構造を確認できるようにする。
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2]
  - id: UNICODE-SOURCE-2
    statement: 双方向制御文字、不可視文字、表示だけで改行に見える文字について、正当な用途も踏まえて受入前に紛らわしい使い方を見つける。
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2]
  - id: UNICODE-SOURCE-3
    statement: 識別子の元の綴りと処理系の解釈を比べ、似た別名や正規化による違いを見落とさない。
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2, SPEC-UNICODE-SECURITY-MECHANISMS]
  - id: UNICODE-SOURCE-4
    statement: レビューしたrevisionの受入時に検査し、投稿者が方針や迂回権限を無言で変えられないようにする。
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2]
  - id: UNICODE-SOURCE-5
    statement: 対象漏れ、文字コード・構文の不正、ツール障害は確認未了とし、調査に必要な位置、分類、code pointだけを記録する。
    source_refs: [SPEC-UNICODE-SOURCE-HANDLING-2]
