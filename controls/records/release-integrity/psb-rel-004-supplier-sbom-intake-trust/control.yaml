schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-REL-004
title: Supplier SBOM intake trust
domain: release-integrity
status: pilot
question: Can a supplier SBOM be authenticated and bound to the expected supplier product and exact artifact before it enters the normal component portfolio?
direct_failure: A validly signed but wrong-product wrong-artifact untrusted or unevaluated supplier SBOM or one with undisclosed coverage gaps becomes authoritative inventory in the normal portfolio.
threats:
  - a transfer attacker or mistaken supplier release job attaches a valid SBOM to a different product or artifact
  - an unapproved signer or delivery identity and unavailable trust status is treated as authorized
  - malformed or incomplete input contaminates inventory used for vulnerability impact decisions
  - a quarantine bypass or overprivileged importer writes to unrelated portfolio projects
security_properties:
  - id: SUP-INTAKE-1
    statement: Define consumer-owned expectations for supplier product version artifact delivery and authorized signing or delivery identities before evaluating received data.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-2
    statement: Verify SBOM content integrity and origin by the adopted method using consumer-owned trust anchors and evaluate required signing-time status revocation and transparency evidence without treating an embedded key as trusted.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-3
    statement: Bind authenticated SBOM bytes to the expected supplier product version and exact acquired or used artifact identity instead of inferring the match from a name or version alone.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-4
    statement: Validate the adopted BOM format version identities and relationships and preserve known coverage gaps without inferring accuracy or completeness from a signature or schema pass.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-5
    statement: Quarantine mismatched unknown or invalid supplier input and stop on verification or status-source errors without allowing either outcome into normal portfolio import.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-6
    statement: Preserve the accepted supplier product artifact and SBOM relation and re-evaluate it on correction signer change revocation or withdrawal.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-7
    statement: Restrict import to an exact destination and necessary operation and retain minimal decision evidence without copying confidential BOM bodies signatures or key material.
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
