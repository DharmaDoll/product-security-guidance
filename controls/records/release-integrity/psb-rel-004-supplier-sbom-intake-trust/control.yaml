schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-REL-004
title: Supplier SBOM intake trust
domain: release-integrity
status: pilot
question: 供給者のSBOMを期待する製品と成果物へ照合し、通常台帳へ入れる前に判断できるか。
direct_failure: 別製品・別成果物・未評価のSBOMが、通常台帳の正本になる。
threats:
  - 攻撃者または供給者の手違いで、正しい署名のSBOMが別製品へ付けられる
  - 未承認の署名者・配送元や確認不能な状態を許可する
  - 不正または不完全なSBOMが脆弱性の影響調査に使う台帳へ入る
  - 隔離の迂回や広い取込権限で無関係のprojectへ書き込む
security_properties:
  - id: SUP-INTAKE-1
    statement: 利用者側で供給者・製品・版・成果物・配送方法・許可する署名者や配送元を先に決める。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-2
    statement: 利用者の信頼根拠でSBOMの内容と出所を確認し、必要な時刻・失効等の証拠を評価する。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-3
    statement: 認証したSBOMを期待する製品・版と、受領・使用する成果物の変更不能な識別子へ結び付ける。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-4
    statement: 採用形式・版・識別子・関係と既知の欠落を確認し、署名や形式の合格を完全性の証明にしない。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-5
    statement: 不一致・未知・無効な入力を隔離し、検証や状態取得の障害を止めて、通常台帳へ自動取込しない。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-6
    statement: 受入れた供給者・製品・成果物・SBOMの関係を保ち、訂正・署名者変更・失効・撤回時に再評価する。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
  - id: SUP-INTAKE-7
    statement: 取込先と操作を限定し、判断記録へ非公開のSBOM本文・署名・鍵素材を余分に残さない。
    source_refs: [REF-SUPPLIER-SBOM-INTAKE-001]
