schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-REL-003
title: Release SBOM identity and analysis boundary
domain: release-integrity
status: pilot
question: リリースに使うSBOMは、完成した成果物と観測範囲に結び付き、公開・分析・稼働先へ辿れるか。
direct_failure: 別の成果物やsourceだけのSBOM、未処理のSBOMを、配布・稼働する成果物の完全な部品表として扱う。
threats:
  - 版・file名・保存場所だけで別のbytesに対するSBOMを成果物へ結び付ける
  - Generatorの観測漏れや関係の欠落を隠し、部品を影響調査から落とす
  - 公開・取込・分析・収集の失敗を完全または脆弱性なしと扱う
  - Source・build・稼働時の観測を上書きし、成果物と稼働先の関係を失う
security_properties:
  - id: SBOM-REL-1
    statement: Source・build後・稼働時の観測を取得地点と範囲で分け、完成物を調べたSBOMをリリースの正本にする。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-2
    statement: 各成果物のdigestを対応するSBOMのdigest・serial・版・root componentへ結び付ける。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-3
    statement: 採用形式と版を検証し、部品の識別子・参照・関係をたどれるようにし、未対応・不正・曖昧なデータを拒否する。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-4
    statement: 成果物の種類ごとに観測すべき部品とgeneratorの範囲を示し、完全・不完全・不明・非表示を区別する。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-5
    statement: 必要なSBOMと成果物との関係を利用者が取得できるまでreleaseを未完了とし、保持・訂正・撤回を成果物に合わせる。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-6
    statement: 分析先のproject・releaseを先に特定し、upload権限とreceipt・logに残す情報を限定する。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-7
    statement: 受付・検証・取込・分析完了を分け、失敗・古い分析データ・部分取得・page欠落を脆弱性なしにしない。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-8
    statement: 成果物のdigestから稼働先へ辿れる関係を保ち、観測漏れを稼働なしと扱わない。
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
