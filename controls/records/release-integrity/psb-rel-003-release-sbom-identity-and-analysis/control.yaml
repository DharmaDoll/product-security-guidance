schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-REL-003
title: Release SBOM identity and analysis boundary
domain: release-integrity
status: pilot
question: Can an SBOM used as release evidence remain bound to the exact released artifact with honest coverage through publication analysis processing and deployment impact lookup?
direct_failure: A source-only different-build incomplete unknown or unprocessed SBOM is treated as authoritative clean inventory for a released or deployed artifact.
threats:
  - release automation associates an SBOM with an artifact by version filename or location while the SBOM describes different bytes
  - unsupported generator surfaces missing relationships or unjustified completeness claims hide components from impact analysis
  - publication upload validation processing analyzer or collection failure is converted into a clean or complete state
  - source build and operations observations overwrite one another and break the commit artifact deployment identity graph
security_properties:
  - id: SBOM-REL-1
    statement: Keep source build and deployment or operations observations distinct with capture phase subject tool configuration identity authority and known coverage and use a final-artifact build or post-build observation as release authority.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-2
    statement: Bind every released artifact digest to the corresponding SBOM digest serial version and root component without relying on filenames product versions tags or storage proximity.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-3
    statement: Pin and validate the adopted format version and require machine-readable component identities unique references and resolvable dependency or assembly relationships while rejecting unsupported malformed or ambiguous data.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-4
    statement: Define component surfaces and generator coverage per artifact type and preserve supported complete incomplete unknown or redacted states without inferring completeness from format validity or component counts.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-5
    statement: Keep a release incomplete until its required immutable SBOM and artifact relation are retrievable by intended consumers and align retention correction and withdrawal with artifact use support and investigation windows.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-6
    statement: Pre-bind analysis intake to an exact project and release identity with least-privilege upload authority and avoid duplicating credentials BOM bodies or unnecessary internal data in receipts and logs.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-7
    statement: Distinguish transport acceptance validation ingestion and analysis completion bind results to the expected SBOM and project and never convert failure timeout stale analysis data partial retrieval or missing pages into clean.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
  - id: SBOM-REL-8
    statement: Preserve searchable relations from released artifact digests to deployment and environment observations without overwriting source build or operations inventories or treating collection gaps as no deployment.
    source_refs: [REF-RELEASE-SBOM-LIFECYCLE-001]
