schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-REL-002
title: Provenance distribution and availability boundary
domain: release-integrity
status: pilot
question: 利用者は、手元の成果物に対応する来歴を必要な期間中に見つけて取得できるか。
direct_failure: 成果物は利用できるのに、必要な来歴が欠落・不明・取得不能・早期削除されている。
threats:
  - 来歴と成果物ごとの対応を公開する前にrelease automationが成果物を公開する
  - Release名・可変tag・上書きされた一覧から別の来歴へ案内する
  - Storage・複製・cache・cleanupで来歴だけが消え、成果物は利用可能なまま残る
  - 不完全・古い・取得失敗した一覧を完了扱いし、来歴の要件を下げる
security_properties:
  - id: PROV-DIST-1
    statement: 来歴を必要とする成果物・配布経路・利用者を決め、各成果物を正確なdigestで列挙する。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
  - id: PROV-DIST-2
    statement: 各成果物のdigestから一つ以上の来歴と取得先へ辿れるようにし、複数の成果物・来歴の種類を区別する。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
  - id: PROV-DIST-3
    statement: 必要な来歴と対応一覧が保存・取得できるまでreleaseを未完了とし、部分公開や再試行を区別する。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
  - id: PROV-DIST-4
    statement: 配布側の表示だけに頼らず、想定する利用者から安全に来歴を発見・取得できるようにする。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
  - id: PROV-DIST-5
    statement: 成果物・来歴・一覧を変更不能なidentityへ結び、訂正は新しいidentityと明示した関係で示す。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
  - id: PROV-DIST-6
    statement: 成果物の利用・support・調査期間中は来歴と一覧を保持し、mirror・cache・公開停止後の状態も説明できるようにする。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
  - id: PROV-DIST-7
    statement: 来歴の欠落・削除・アクセス低下・古い一覧・取得失敗を区別し、保護対象の必須要件を黙って下げない。
    source_refs: [SPEC-PROVENANCE-DISTRIBUTION]
