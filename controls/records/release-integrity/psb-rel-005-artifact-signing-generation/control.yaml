schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-REL-005
title: Artifact signing generation
domain: release-integrity
status: pilot
question: 承認した成果物そのものに、許可した主体だけが署名し、利用者へ渡せるか。
direct_failure: 正規の署名者が別の成果物へ署名するか、署名・検証材料が欠けたままreleaseを完了する。
threats:
  - 侵害されたrelease jobが承認と署名の間で成果物を差し替える
  - 盗まれた、または広すぎる署名権限で未承認のreleaseへ署名する
  - 有効な署名を別releaseへ付けるか、利用者が取得できない
  - 署名や公開の失敗をrelease gateが無視する
security_properties:
  - id: ART-SIGN-1
    statement: 承認したreleaseを変更不能な成果物のbytesまたはdigestへ結び、署名器へ渡す対象を再確認する。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
  - id: ART-SIGN-2
    statement: 署名できるworkload・操作・成果物・signerを限定し、権限の再利用範囲と期限を強制する。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
  - id: ART-SIGN-3
    statement: 鍵やidentityを保護・交代できるようにし、署名権限を未信頼のbuild処理や一般の編集権限から分ける。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
  - id: ART-SIGN-4
    statement: 採用形式で正確な成果物へ署名し、予定する利用者の信頼条件で結果を確認する。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
  - id: ART-SIGN-5
    statement: 署名と必要な検証材料を成果物から辿って取得できるよう公開し、採用方式が求める証拠を保つ。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
  - id: ART-SIGN-6
    statement: 署名・検証・必要な公開の失敗や評価不能でrelease完了を止め、無署名へ自動変更しない。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
  - id: ART-SIGN-7
    statement: 成果物・signer・policy版・結果・公開先を記録し、tokenや秘密鍵を一般ログへ残さない。
    source_refs: [REF-ARTIFACT-SIGNING-BOUNDARY-001]
