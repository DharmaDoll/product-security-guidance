schema_version: 0.1-pilot
artifact_kind: control-record
id: PSB-SOURCE-002
title: Secret publication boundary
domain: source-protection
status: migration-pilot
question: 秘密情報を含む変更や検査できなかった変更を、定めた送信・受入・mergeの境界で止められるか。
direct_failure: 検査の省略・欠落・対象違いで変更が境界を越える、または検出結果が秘密値を再び漏らす。
threats:
- ステージした内容、メタデータ、履歴への秘密情報の混入
- ローカルhookの省略と別の書込み経路
- 検査器や方針の差替え、実行失敗、秘密値を含む出力
security_properties:
- id: SECRET-1
  statement: 守る秘密情報、共有経路、ref、内容、履歴、検査できない範囲、拒否する境界を定める。
  legacy_check_refs:
  - GHK-005
  - GHK-006
  - GHK-008
  - GHK-011
  source_refs:
  - REF-SECRET-PUBLICATION-001
  - SPEC-OPENSSF-OSPS-2026.02.19
- id: SECRET-2
  statement: 検査を、実際にコミット・導入する内容とメタデータ、過去コミットへ結び付ける。
  legacy_check_refs:
  - GHK-006
  - GHK-007
  - GHK-009
  - GHK-010
  - GHK-011
  source_refs:
  - REF-SECRET-PUBLICATION-001
  - SPEC-OPENSSF-OSPS-2026.02.19
- id: SECRET-3
  statement: hook・検査器・方針の版と変更を、未レビューの変更から独立して管理する。
  legacy_check_refs:
  - GHK-001
  - GHK-002
  - GHK-014
  source_refs:
  - REF-SECRET-PUBLICATION-001
- id: SECRET-4
  statement: 検出あり、完了した検査で検出なし、失敗・未完了を区別し、必要な検査が失敗したら操作を止める。
  legacy_check_refs:
  - GHK-008
  - GHK-012
  - GHK-014
  source_refs:
  - REF-SECRET-PUBLICATION-001
  - SPEC-OPENSSF-OSPS-2026.02.19
- id: SECRET-5
  statement: ローカルhookを省略した場合や別の書込み経路でも、共有先で独立して受入を判断する。
  legacy_check_refs: []
  source_refs:
  - REF-SECRET-PUBLICATION-001
  - SPEC-OPENSSF-OSPS-2026.02.19
- id: SECRET-6
  statement: 通常出力、エラー、報告、通知のどの経路にも検出値を表示しない。
  legacy_check_refs:
  - GHK-007
  - GHK-014
  source_refs:
  - REF-SECRET-PUBLICATION-001
- id: SECRET-7
  statement: 除外と例外を対象・内容・ルール・期限・独立した承認へ限定し、検査エラーを隠さない。
  legacy_check_refs: []
  source_refs:
  - REF-SECRET-PUBLICATION-001
