schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-SOURCE-004
title: Source credential lifecycle
domain: source-protection
status: migration-pilot
question: ソース管理に使う認証情報は必要な人・処理と操作だけに使え、不要になったら確実に止められるか。
direct_failure: 盗まれた、権限が広すぎる、所有者が不明、または不要になった認証情報で、ソースやワークフローなどを操作できる。
threats:
  - 攻撃者が端末やツールから認証情報を盗む
  - 権限が広すぎて無関係なリポジトリや操作まで使われる
  - 異動、退職、端末紛失、用途終了、漏えいの後も権限が残る
  - 現在の権限と利用履歴が分からず、対応が遅れる
security_properties:
  - id: SRC-AUTH-1
    statement: 権限を使う主体、目的、対象リポジトリ、操作、有効期限を明確にする。
    legacy_check_refs: [SCL-002, SCL-003, SCL-004, SCL-005, SCL-012, SCL-014]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-AI-004]
  - id: SRC-AUTH-2
    statement: 認証情報の発行や重要な変更では、対象のリスクに応じた強い認証を行う。
    legacy_check_refs: [SCL-007, SCL-013]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-USER-001]
  - id: SRC-AUTH-3
    statement: 自動処理には開発者個人の認証情報を使い回さず、処理内容を絞った専用のIDを使う。
    legacy_check_refs: [SCL-001]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-AI-004]
  - id: SRC-AUTH-4
    statement: 認証情報を承認された保護場所に置き、必要な処理だけへ渡す。
    legacy_check_refs: [SCL-006, SCL-008, SCL-015, SCL-016]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-AI-004, REF-USER-001]
  - id: SRC-AUTH-5
    statement: 現在使える権限を確認し、退職や紛失などの後に該当する認証情報・認可・関連セッションと別に残る権限を止め、古い権限でのアクセスが拒否されることを確かめる。
    legacy_check_refs: [SCL-009, SCL-010]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-AI-004]
  - id: SRC-AUTH-6
    statement: 発行、権限変更、利用、失効を、所有者と対象リソースに結び付けて調べられるようにする。
    legacy_check_refs: [SCL-011, SCL-017]
    source_refs: [SPEC-GITHUB-SECURITY-GUIDANCE, REF-AI-004]
