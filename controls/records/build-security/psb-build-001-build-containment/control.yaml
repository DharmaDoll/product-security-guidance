  "title": "Build containment",
  "domain": "build-security",
  "status": "migration-pilot",
  "question": "ビルド中に動くコードから、秘密情報や公開・deploy権限へ届かないか。",
  "direct_failure": "ビルドコードが認証情報やhost権限を使い、情報を持ち出すか公開・deployを操作する。",
  "threats": [
    "侵害された依存やビルドスクリプトが認証情報、ソース、成果物を外部へ送る。",
    "ビルドjobで動くコードがdeploy権限や本番環境へ到達する。"
  ],
  "security_properties": [
    {
      "id": "BUILD-1",
      "statement": "認証が必要な入力は別の境界で用意し、ビルドコードへ秘密情報、token発行能力、管理面の書込権限を渡さない。",
      "legacy_check_refs": [
        "BLD-001"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-2",
      "statement": "Buildとdeployの権限を分け、固定した成果物を受取側が独立して判断する。",
      "legacy_check_refs": [
        "BLD-002"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-3",
      "statement": "通信を既定で拒否し、必要な宛先だけをビルドコードの外側で許可する。直通、proxy、DNS、redirect、metadata経由も確認する。",
      "legacy_check_refs": [
        "BLD-003"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-4",
      "statement": "一時的な非root環境と読み取り専用root、専用の書込領域を使い、host socketや管理サービスへ届かせない。",
      "legacy_check_refs": [
        "BLD-004"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-5",
      "statement": "Processとnetworkを観測し、sensorと配送の健全性を別に確認して、通知・調査の担当を決める。",
      "legacy_check_refs": [
        "BLD-005"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-6",
      "statement": "設定欠落や失敗・部分的・古い観測では公開工程への昇格を止め、未確認と違反を区別する。",
      "legacy_check_refs": [
