  "title": "Build containment",
  "domain": "build-security",
  "status": "migration-pilot",
  "question": "Can build code execute without acquiring publication, deployment or host authority?",
  "direct_failure": "Compromised dependencyまたはbuild scriptがCI credential、source、artifactを外部へ送信する。",
  "threats": [
    "Compromised dependencyまたはbuild scriptがCI credential、source、artifactを外部へ送信する。",
    "Untrusted sourceを実行するjobがdeploy権限またはproduction environmentへ到達する。"
  ],
  "security_properties": [
    {
      "id": "BUILD-1",
      "statement": "Keep secrets token issuance and control-plane write authority out of build code; prepare authenticated inputs across a separate acquisition boundary.",
      "legacy_check_refs": [
        "BLD-001"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-2",
      "statement": "Separate build from deployment authority and pass fixed artifacts to a receiver that independently evaluates contents and expectations.",
      "legacy_check_refs": [
        "BLD-002"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-3",
      "statement": "Deny network access by default and enforce necessary destinations outside build control, accounting for direct proxy DNS redirect and metadata bypasses.",
      "legacy_check_refs": [
        "BLD-003"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-4",
      "statement": "Use an ephemeral non-root environment with a read-only root and dedicated writable areas, excluding host sockets and management services.",
      "legacy_check_refs": [
        "BLD-004"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-5",
      "statement": "Observe processes and network activity, check sensor and delivery health separately, and assign notification and investigation ownership.",
      "legacy_check_refs": [
        "BLD-005"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    },
    {
      "id": "BUILD-6",
      "statement": "Stop output promotion for missing configuration or failed partial stale observation, distinguishing unverified states from detected violations.",
      "legacy_check_refs": [
        "BLD-006"
      ],
      "source_refs": [
        "SPEC-BUILD-CONTAINMENT"
      ]
    }
  ],
