schema_version: 0.1-pilot
artifact_kind: control-record
id: PSB-BUILD-003
title: Platform provenance generation
domain: build-security
status: migration-pilot
question: ビルドの来歴をjob自身の申告ではなく基盤が作り、成果物へ結び付けられるか。
direct_failure: Jobが来歴を省略・偽造し、別の成果物や入力を信頼済みの記録として公開する。
threats: [来歴の欠落, jobによる基盤の事実の偽装, 成果物の差替え, 来歴の改変, 生成・認証の失敗]
security_properties:
- {id: PROV-GEN-1, statement: 対象となる成功ビルドごとに基盤側で来歴を作り、jobから生成を省略・置換できないようにする。, legacy_check_refs: [PPG-001], source_refs: [SPEC-PLATFORM-PROVENANCE-GENERATION]}
- {id: PROV-GEN-2, statement: 対象成果物すべてを実際のbytesのdigestへ結び付け、差替え・再利用・一部欠落を拒否する。, legacy_check_refs: [PPG-002], source_refs: [SPEC-PLATFORM-PROVENANCE-GENERATION]}
- {id: PROV-GEN-3, statement: 採用したschemaとbuildDefinition・runDetails・buildType・externalParameters・builder identity・ソース入力を記録する。, legacy_check_refs: [PPG-002], source_refs: [SPEC-PLATFORM-PROVENANCE-GENERATION]}
- {id: PROV-GEN-4, statement: 信頼判断に使うfieldごとに情報源と境界を定め、利用者由来の例外と基盤による検証を区別する。, legacy_check_refs: [PPG-003], source_refs: [SPEC-PLATFORM-PROVENANCE-GENERATION]}
- {id: PROV-GEN-5, statement: 利用者が来歴の出所と改変の有無を検証できる形で認証し、その能力をjobへ渡さない。, legacy_check_refs: [PPG-004], source_refs: [SPEC-PLATFORM-PROVENANCE-GENERATION]}
- {id: PROV-GEN-6, statement: 来歴の欠落・不正・不一致・認証不能・生成失敗を成功にせず、通常公開への受け渡しを止める。, legacy_check_refs: [PPG-005], source_refs: [SPEC-PLATFORM-PROVENANCE-GENERATION]}
