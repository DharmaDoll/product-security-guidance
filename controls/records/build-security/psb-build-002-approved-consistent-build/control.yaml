schema_version: "0.1-pilot"
artifact_kind: control-record
id: PSB-BUILD-002
title: Approved and consistent release build
domain: build-security
status: pilot
question: 今回のリリース成果物は、承認した基盤と手順で作られたか。
direct_failure: 未承認の基盤や変更された手順で作った成果物が、通常のリリースとして公開される。
threats:
  - 担当者が端末や未承認のbuilderで作った成果物を、正規のリリース名で公開する
  - 承認済みbuilderでも、変更された定義・開始処理・入力から別の成果物を作る
  - Jobが自分で書いた記録を、基盤の実行や能力の証拠として受け入れる
  - 証拠の欠落や部分的な取得を、正規のビルドとして扱う
security_properties:
  - id: CONSISTENT-BUILD-1
    statement: 対象リリースと目標水準を決め、基盤の能力と信頼境界を確認してbuilderを承認する。
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
  - id: CONSISTENT-BUILD-2
    statement: 通常リリースを承認済みbuilderの出力に限り、目標水準が求める場合はhosted実行も確認する。
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
  - id: CONSISTENT-BUILD-3
    statement: レビューしたソースとビルド定義を変更不能なrevisionへ結び、実際に使った定義を特定する。
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
  - id: CONSISTENT-BUILD-4
    statement: Build type、開始処理、重要な外部入力と起動条件の期待値を決め、未承認の変更を公開前に拒否する。
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
  - id: CONSISTENT-BUILD-5
    statement: 成果物のdigestを基盤由来の実行情報へ結び、jobの自己申告に頼らず承認した基盤・手順と照合する。
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
  - id: CONSISTENT-BUILD-6
    statement: 基盤・手順の不一致や証拠の欠落・不正・古さ・取得不能で通常リリースを止め、拒否と評価不能を区別する。
    source_refs: [SPEC-CONSISTENT-BUILD-PRODUCER]
