apiVersion: v1
kind: Pod
metadata:
  name: reject-over-quota
  namespace: psb-resource-test
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: first
      image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
      args: [pause]
      resources:
        requests:
          cpu: 400m
          memory: 64Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: 400m
          memory: 64Mi
          ephemeral-storage: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
    - name: second
      image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
      args: [pause]
      resources:
        requests:
          cpu: 400m
          memory: 64Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: 400m
          memory: 64Mi
          ephemeral-storage: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
