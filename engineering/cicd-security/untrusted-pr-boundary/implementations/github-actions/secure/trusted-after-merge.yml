name: Trusted post-merge boundary

# This starts a fresh run from reviewed main-branch state.
# It consumes no artifact, cache, output, or workspace from the PR run.
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  trusted-boundary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Start from the reviewed main-branch revision
        # Replace this marker with the trusted task and grant only its exact
        # permissions. Do not reintroduce executable state from the PR run.
        run: echo "trusted push boundary reached"
