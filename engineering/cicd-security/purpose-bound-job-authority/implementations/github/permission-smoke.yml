# Configure the security-smoke Environment before copying this workflow.
name: Workflow authority smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  read-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Confirm source was checked out
        run: git rev-parse --verify HEAD

  approved-marker:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: security-smoke
    steps:
      - name: Confirm the protected job started
        run: printf '%s\n' 'ENVIRONMENT_JOB_STARTED'
